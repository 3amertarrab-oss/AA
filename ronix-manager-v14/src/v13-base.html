<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RONIX | إدارة المصممين والمشاريع</title><style>
:root{--bg:#f3f5f8;--navy:#172337;--gold:#b58a48;--text:#243045;--muted:#6b7889;--line:#e0e5ed;--ok:#087c69;--bad:#b33d4a}*{box-sizing:border-box}body{font-family:Tahoma,'Segoe UI',Arial,sans-serif;margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{display:flex;min-height:100vh}.side{width:244px;flex:none;background:var(--navy);color:#fff;padding:24px 15px;min-height:100vh}.logo{font:800 31px 'Segoe UI',Tahoma;color:#e0ba7a;letter-spacing:3px;text-align:center;margin:15px 0 5px}.sublogo{text-align:center;color:#a6b2c3;font-size:11px;margin-bottom:37px;letter-spacing:1px}.nav{display:block;width:100%;text-align:right;border:none;border-radius:11px;background:transparent;color:#d9e2ee;padding:15px 16px;margin:5px 0;font-weight:bold}.nav:hover,.nav.active{background:#34465e;color:#f6dbaa}.nav span{display:inline-block;width:26px}.sidebar-footer{margin-top:48px;font-size:11px;color:#9facbb;line-height:1.8;padding:10px}.main{flex:1;min-width:0;padding:29px 35px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:25px;flex-wrap:wrap}.eyebrow{color:var(--gold);font-weight:bold;font-size:12px;letter-spacing:1px}h1{font-size:27px;margin:6px 0;color:#1d2c42}h2{font-size:19px;margin:0 0 15px}.subtitle{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:11px 17px;border-radius:9px;border:1px solid var(--line);background:white;color:var(--navy);font-weight:bold}.btn.primary{background:var(--navy);border-color:var(--navy);color:white}.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}.btn.danger{color:var(--bad)}.btn:hover{filter:brightness(.95)}.grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:16px;margin-bottom:23px}.stat{background:white;border:1px solid var(--line);border-radius:15px;padding:19px 18px;box-shadow:0 3px 16px #22314b08}.stat small{color:var(--muted);font-weight:bold}.stat strong{display:block;font-size:27px;margin-top:14px;color:var(--navy);font-variant-numeric:tabular-nums}.stat.gold strong{color:#99723c}.stat.green strong{color:var(--ok)}.stat.red strong{color:var(--bad)}.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:21px;margin-bottom:20px;box-shadow:0 3px 16px #22314b05}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}.tablewrap{width:100%;overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th{background:#f0f3f7;color:#516075;text-align:right;padding:14px 13px;font-weight:700}td{padding:14px 13px;border-bottom:1px solid #ecf0f5}tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafbfc}.num{text-align:left;font-variant-numeric:tabular-nums;direction:ltr}.pill{display:inline-block;background:#e9f7f0;color:#08745b;border-radius:20px;padding:5px 10px;font-size:11px;font-weight:bold}.pill.warn{background:#fbecea;color:#ad4550}.link{background:none;border:none;color:#98713c;font-weight:700;padding:3px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}.field{padding:11px 12px;border:1px solid #d5dce6;border-radius:9px;background:#fff;width:100%;outline:none}.field:focus{border-color:var(--gold);box-shadow:0 0 0 3px #b58a4821}.filters .field{max-width:340px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formgrid label{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:bold;color:#526175}.full{grid-column:1/-1}.empty{text-align:center;color:#7f8b9a;padding:48px}.overlay{position:fixed;inset:0;background:#0b1527aa;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.overlay.open{display:flex}.modal{background:#fff;max-width:690px;width:100%;max-height:92vh;overflow:auto;border-radius:18px;padding:26px;box-shadow:0 22px 75px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.modalhead h2{margin:0}.close{background:#f1f3f6;border:0;border-radius:8px;font-size:23px;width:36px;height:36px;color:#526175}.modalfoot{display:flex;gap:9px;justify-content:flex-start;margin-top:22px;border-top:1px solid var(--line);padding-top:18px}.notice{background:#fff8e8;border:1px solid #f1e1bb;padding:12px;border-radius:10px;color:#78623e;line-height:1.9;font-size:12px}.projecthead{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.projectmeta{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.minicard{border:1px solid var(--line);border-radius:12px;padding:15px}.minicard small{color:#748093}.minicard strong{display:block;margin-top:12px;font-size:20px}.hide{display:none!important}.toast{position:fixed;left:25px;bottom:25px;background:#172337;color:white;padding:13px 19px;border-radius:10px;display:none;z-index:55;box-shadow:0 12px 30px #0003}.footer{text-align:center;color:#98a1ad;font-size:11px;margin:25px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.side{width:185px}.main{padding:22px 17px}}@media(max-width:650px){.layout{display:block}.side{min-height:auto;width:100%;padding:7px 10px;display:flex;overflow:auto;align-items:center}.logo{font-size:17px;margin:0 12px}.sublogo,.sidebar-footer{display:none}.nav{width:auto;white-space:nowrap;font-size:12px;padding:9px 11px}.nav span{display:none}.main{padding:16px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:12px}.stat strong{font-size:18px}.two,.formgrid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}h1{font-size:22px}}@media print{.side,.actions,.filters,.btn,.link,.footer{display:none!important}.main{padding:0}.panel,.stat{box-shadow:none}.layout{display:block}body{background:white}}

.project-gallery{display:grid;grid-template-columns:minmax(210px,310px) 1fr;gap:20px;align-items:start}.photo-hero{aspect-ratio:16/11;display:flex;align-items:center;justify-content:center;border:1px dashed #c4cdd8;background:#f4f6f9;border-radius:14px;overflow:hidden;color:#8491a1;position:relative}.photo-hero img{width:100%;height:100%;object-fit:cover}.photo-grid{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.photo-tile{width:105px;border:1px solid #dce2ec;border-radius:10px;overflow:hidden;background:#fff}.photo-tile img{display:block;width:100%;height:70px;object-fit:cover}.photo-tile .photo-btns{display:flex;justify-content:space-around;padding:5px}.photo-tile button{border:0;background:transparent;color:#886734;font-size:11px;cursor:pointer}.photo-tag{color:#738093;font-size:12px;line-height:1.9}.thumb{width:52px;height:38px;object-fit:cover;border-radius:6px;border:1px solid #dde4ed}.photo-count{font-size:12px;color:#85909d}.photo-upload{display:none}@media(max-width:700px){.project-gallery{grid-template-columns:1fr}.photo-hero{max-width:100%}}@media print{.photo-tile button,.photo-upload{display:none!important}}

/* Customer claims and print layout */
.claim-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0 18px}.claim-kpis .minicard{background:#fafbfc}.claim-section{border-top:1px solid #e9edf2;padding-top:16px;margin-top:16px}.hint{font-size:12px;color:#6d7d8f;line-height:1.8}.claim-title{font-size:15px;color:#a27b3d;font-weight:bold}.row-actions{display:flex;gap:8px;flex-wrap:wrap}.claim-row{background:#fff;border:1px solid #e2e8ed;border-radius:12px;padding:13px;margin:9px 0}@media(max-width:760px){.claim-kpis{grid-template-columns:repeat(2,1fr)}}
@media print{@page{size:A4;margin:13mm}.side,.top,.footer,.overlay,.btn{display:none!important}.main{padding:0}table{white-space:normal}.panel{break-inside:avoid}}

/* V6 project photo import + multi-designer UI */
.designer-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.designer-badge{padding:6px 10px;border-radius:999px;background:#eef3ff;border:1px solid #d5def3;font-size:13px}.project-note{margin:10px 0 0;color:#6f7b88;font-size:13px}.project-summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}.project-mini{background:#f7f9fc;border:1px solid #e4e9f0;border-radius:14px;padding:12px}.project-mini small{display:block;color:#6f7b88;margin-bottom:6px}.project-mini strong{font-size:20px}.hint-box{background:#fff8e8;border:1px solid #f0ddb0;color:#7b5f19;padding:10px 12px;border-radius:12px;margin-top:10px;font-size:13px}


/* V7 responsive interactive controls */
button,.btn,.link,.nav{cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,background-color .16s ease,border-color .16s ease,opacity .16s ease;touch-action:manipulation}
button:hover:not(:disabled),.btn:hover:not(:disabled),.link:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.035)}
button:active:not(:disabled),.btn:active:not(:disabled){transform:translateY(1px) scale(.985)}
button:focus-visible,.field:focus-visible{outline:3px solid rgba(181,138,72,.45);outline-offset:2px}
button:disabled{opacity:.55;cursor:not-allowed;filter:grayscale(.2)}
.nav.active{box-shadow:inset -4px 0 0 #b58a48;background:rgba(181,138,72,.15)}
.btn.primary:hover,.btn.gold:hover{box-shadow:0 7px 18px rgba(21,35,55,.18)}
.modal{max-height:min(90vh,900px);overflow:auto}

@media(max-width:760px){.actions{flex-wrap:wrap}.btn{min-height:40px}.projecthead{flex-wrap:wrap}.project-summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* V9 claims improvements */
.claim-form-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:start}.claim-sidecard{background:#f8fafc;border:1px solid #e2e8f0;border-radius:18px;padding:14px}.claim-sidecard img{width:100%;max-height:190px;object-fit:cover;border-radius:14px;border:1px solid #d7dee8;margin-top:8px}.claim-sidecard .meta{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px;font-size:13px}.claim-sidecard .meta div{background:white;border:1px solid #e6ebf2;border-radius:12px;padding:9px 10px}.claim-totals{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:10px;margin-top:12px}.claim-mini{background:#fff;border:1px solid #e6ebf2;border-radius:12px;padding:10px}.claim-mini small{display:block;color:#667085;margin-bottom:4px}.claim-mini strong{font-size:18px}.claim-preview-lines{font-size:13px;color:#475467;line-height:1.7;margin-top:10px;max-height:120px;overflow:auto}.modal .claim-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.btn.secondary{background:#eef4ff;color:#173765;border:1px solid #c8d8f5}@media (max-width:980px){.claim-form-grid{grid-template-columns:1fr}.claim-totals{grid-template-columns:1fr 1fr}}
</style></head><body><div class="layout"><aside class="side"><div><div class="logo">RONIX</div><div class="sublogo">DESIGNER FINANCE</div></div><button class="nav active" data-page="dashboard" onclick="go('dashboard')"><span>◈</span>الرئيسية</button><button class="nav" data-page="projects" onclick="go('projects')"><span>▣</span>المشاريع</button><button class="nav" data-page="designers" onclick="go('designers')"><span>♟</span>المصممون</button><button class="nav" data-page="payments" onclick="go('payments')"><span>▤</span>الدفعات</button><button class="nav" data-page="clients" onclick="go('clients')"><span>◉</span>كشف حساب العملاء</button><button class="nav" data-page="claims" onclick="go('claims')"><span>▤</span>مطالبات العملاء</button><button class="nav" data-page="advanced" onclick="go('advanced')"><span>✦</span>*** المالية المتقدمة</button><button class="nav" data-page="reports" onclick="go('reports')"><span>▥</span>التقارير</button><div class="sidebar-footer">RONIX ENGINEERING<br>نسخة تشغيل محلية · البيانات تحفظ على هذا المتصفح</div></aside><main class="main"><header class="top"><div><div class="eyebrow">RONIX / PROJECT ACCOUNTS</div><h1 id="title">لوحة التحكم</h1><div class="subtitle" id="sub">إدارة المشروع والمصمم والمدفوعات من مكان واحد</div></div><div class="actions"><button class="btn" onclick="backup()">↓ نسخة احتياطية</button><button class="btn" onclick="document.getElementById('restore').click()">↑ استعادة</button><input id="restore" type="file" accept=".json" hidden onchange="restoreData(this)"><button class="btn gold" onclick="openPayment()">+ دفعة جديدة</button></div></header><section id="content"></section><footer class="footer">RONIX © 2026 · يُرجى الاحتفاظ بنسخة احتياطية منتظمة</footer></main></div><div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2 id="modalTitle">إضافة</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div><script>
const seed=r14Empty();
const KEY=r14Key;let data=r14Load();
let page='dashboard',projectFocus='',designerFocus='';const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),money=n=>fmt(n)+' ج.م',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('سعة تخزين الصور والبيانات ممتلئة. احذف بعض الصور أو حمّل نسخة احتياطية.');return false}}
function notify(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2800)}
function getP(code){return data.projects.find(p=>p.code===code)}function getA(code,designer){return data.assignments.find(a=>a.code===code&&a.designer===designer)}function paid(code,designer){return data.payments.filter(p=>(!code||p.code===code)&&(!designer||p.designer===designer)).reduce((n,p)=>n+Number(p.amount||0),0)}function fee(code,designer){return data.assignments.filter(a=>(!code||a.code===code)&&(!designer||a.designer===designer)).reduce((n,a)=>n+Number(a.fee||0),0)}function designers(){return [...new Set(data.assignments.map(a=>a.designer).filter(Boolean))].sort()}
const titles={dashboard:['لوحة التحكم','نظرة مالية شاملة لمشاريع RONIX ومستحقات المصممين'],projects:['إدارة المشاريع','فتح ملف كل مشروع ومتابعة تكليفاته ومدفوعاته'],designers:['حسابات المصممين','مستحق كل مصمم والمدفوع والرصيد المتبقي'],payments:['سجل دفعات المصممين','تواريخ الدفعات والمستندات والمبالغ المسجلة'],claims:['مطالبات العملاء','مستخلصات العملاء والتحصيل لكل مشروع'],reports:['التقارير المالية','إصدار كشف حساب وطباعته وتصديره']};
function go(x){page=x;projectFocus='';designerFocus='';document.querySelectorAll('.nav').forEach(a=>a.classList.toggle('active',a.dataset.page===x));$('title').textContent=titles[x][0];$('sub').textContent=titles[x][1];render()}
function stats(){return `<div class="grid"><div class="stat"><small>إجمالي المشاريع</small><strong>${fmt(data.projects.length)}</strong></div><div class="stat gold"><small>أتعاب المصممين</small><strong>${money(fee())}</strong></div><div class="stat green"><small>المدفوع للمصممين</small><strong>${r14Paid(paid(),true)}</strong></div><div class="stat red"><small>المتبقي للمصممين</small><strong>${r14Due(fee()-paid(),true)}</strong></div></div>`}
function cover(p){return (p.photos||[]).find(x=>x.id===p.coverId)||(p.photos||[])[0]}function listP(rows){return `<div class="tablewrap"><table><thead><tr><th>الصورة</th><th>الكود</th><th>المشروع</th><th>العميل</th><th>تكليفات</th><th class="num">أتعاب المصممين</th><th class="num">المدفوع</th><th>التفاصيل</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${cover(p)?`<img class="thumb" src="${cover(p).src}" alt="صورة المشروع">`:"—"}</td><td><b>${esc(p.code)}</b></td><td>${esc(p.name)}</td><td>${esc(p.client)}</td><td>${data.assignments.filter(a=>a.code===p.code).length}</td><td class="num">${fmt(fee(p.code))}</td><td class="num">${r14Paid(paid(p.code))}</td><td><button class="link" onclick="openProject('${r14Encode(p.code)}')">فتح ←</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">لا توجد مشروعات مطابقة</td></tr>'}</tbody></table></div>`}
function dashboard(){let last=[...data.payments].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,6);return stats()+`<div class="two"><div class="panel"><div class="panel-title"><h2>أحدث الدفعات</h2><button class="link" onclick="go('payments')">عرض الكل</button></div><div class="tablewrap"><table><thead><tr><th>المصمم</th><th>المشروع</th><th>التاريخ</th><th class="num">القيمة</th></tr></thead><tbody>${last.map(p=>`<tr><td>${esc(p.designer)}</td><td>${esc(p.code)}</td><td>${esc(p.date)}</td><td class="num">${r14Paid(p.amount)}</td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h2>الوصول السريع</h2><p class="subtitle">إضافة مشروع جديد وربط مصمم به، ثم تسجيل الدفعات المتعددة.</p><div style="display:grid;gap:12px;margin-top:22px"><button class="btn primary" onclick="editProject()">+ إنشاء مشروع جديد</button><button class="btn" onclick="editAssignment()">+ تكليف مصمم بمشروع</button><button class="btn" onclick="openPayment()">+ تسجيل دفعة جديدة</button></div><p class="notice" style="margin-top:20px">البيانات المستوردة تحتاج مطابقة مالية قبل اعتمادها. كل تعديل يتم حفظه محليًا في المتصفح، واستخدم «نسخة احتياطية» دوريًا.</p></div></div><div class="panel"><div class="panel-title"><h2>المشروعات</h2><button class="link" onclick="go('projects')">جميع المشاريع ←</button></div>${listP(data.projects.slice(0,7))}</div>`}
function projectList(){return `<div class="panel"><div class="panel-title"><h2>دليل المشاريع</h2><button class="btn primary" onclick="editProject()">+ مشروع جديد</button></div><div class="filters"><input id="searchP" class="field" oninput="filterProjects()" placeholder="ابحث بالكود أو اسم المشروع أو العميل..."></div><div id="projectRows">${listP(data.projects)}</div></div>`}
function filterProjects(){let q=$('searchP').value.trim().toLowerCase();$('projectRows').innerHTML=listP(data.projects.filter(p=>(p.code+' '+p.name+' '+p.client).toLowerCase().includes(q)))}
function openProject(code){projectFocus=decodeURIComponent(code);renderProject()}
function photoPanel(p){const arr=p.photos||[],main=cover(p),encoded=r14Encode(p.code);return `<div class="panel"><div class="panel-title"><h2>صور المشروع</h2><span class="photo-count">${arr.length} صورة · محفوظة مع النسخة الاحتياطية</span></div><div class="project-gallery"><div class="photo-hero">${main?`<img src="${main.src}" alt="الصورة الرئيسية للمشروع">`:'<div style="text-align:center;font-size:15px">▧<p>لا توجد صورة للمشروع</p></div>'}</div><div><div class="actions"><button class="btn primary" onclick="document.getElementById('photosInput').click()">+ إضافة صور</button></div><input class="photo-upload" id="photosInput" type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="addPhotos(this,'${encoded}')"><p class="photo-tag">يمكنك إضافة عدة صور JPG أو PNG أو WebP. تُصغّر الصور تلقائيًا لتقليل استهلاك التخزين. اضغط «رئيسية» لتغيير صورة الغلاف، أو «حذف» لإزالتها.</p><div class="photo-grid">${arr.map(x=>`<div class="photo-tile"><img src="${x.src}" alt="صورة مشروع"><div class="photo-btns"><button onclick="setCover('${encoded}','${x.id}')">رئيسية</button><button onclick="removePhoto('${encoded}','${x.id}')">حذف</button></div></div>`).join('')}</div></div></div></div>`}
function resizePhoto(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(Error('read'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(Error('image'));img.onload=()=>{const size=Math.min(1,1100/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*size);c.height=Math.round(img.height*size);const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',0.72))};img.src=reader.result};reader.readAsDataURL(file)})}
async function addPhotos(input,encoded){const p=getP(decodeURIComponent(encoded));if(!p)return;const files=[...input.files];input.value='';if(!files.length)return;if(files.length>12){alert('يمكن إضافة 12 صورة في المرة الواحدة');return}const old=JSON.parse(JSON.stringify(p.photos||[]));p.photos=p.photos||[];for(const f of files){if(!/^image\/(jpeg|png|webp)$/.test(f.type)){alert('نوع الملف غير مدعوم: '+f.name);continue}if(f.size>15*1024*1024){alert('الصورة أكبر من 15 ميجابايت: '+f.name);continue}try{const src=await resizePhoto(f);p.photos.push({id:'img'+Date.now().toString(36)+Math.random().toString(36).slice(2,9),name:f.name,src})}catch(e){alert('تعذرت قراءة '+f.name)}}if(!save()){p.photos=old;return}renderProject();notify('تم حفظ الصور مع المشروع')}
function setCover(encoded,id){const p=getP(decodeURIComponent(encoded));if(!p)return;p.coverId=id;if(save()){renderProject();notify('تم تعيين صورة الغلاف')}}
function removePhoto(encoded,id){const p=getP(decodeURIComponent(encoded));if(!p||!confirm('هل تريد حذف هذه الصورة من المشروع؟'))return;const old=p.photos;p.photos=p.photos.filter(x=>x.id!==id);if(p.coverId===id)p.coverId=p.photos[0]?.id||'';if(!save()){p.photos=old;return}renderProject();notify('تم حذف الصورة')}
function renderProject(){const p=getP(projectFocus);if(!p){projectFocus='';render();return}const a=data.assignments.filter(x=>x.code===p.code),ps=data.payments.filter(x=>x.code===p.code).sort((x,y)=>String(y.date).localeCompare(String(x.date)));$('content').innerHTML=`<div class="panel"><div class="projecthead"><div><button class="link" onclick="projectFocus='';render()">← العودة للمشاريع</button><h1>${esc(p.name)}</h1><div class="projectmeta">${esc(p.code)} · ${esc(p.client||'بدون عميل')} · ${esc(p.kind||'')} · ${esc(p.site||'')}</div></div><div class="actions"><button class="btn" onclick="editProject('${r14Encode(p.code)}')">تعديل المشروع</button><button class="btn primary" onclick="editAssignment('${r14Encode(p.code)}')">+ تكليف مصمم</button><button class="btn gold" onclick="openPayment('${r14Encode(p.code)}')">+ دفعة مصمم</button><button class="btn primary" onclick="openClaim('${r14Encode(p.code)}')">+ مطالبة عميل</button><button class="btn" onclick="openReceipt('${r14Encode(p.code)}')">+ تحصيل عميل</button><button class="btn" onclick="projectExcel('${r14Encode(p.code)}')">Excel المشروع</button></div></div></div>${photoPanel(p)}${clientProjectPanel(p)}<div class="grid"><div class="stat"><small>قيمة عقد المشروع</small><strong>${money(p.contract)}</strong></div><div class="stat gold"><small>أتعاب المصممين</small><strong>${money(fee(p.code))}</strong></div><div class="stat green"><small>المدفوع</small><strong>${r14Paid(paid(p.code),true)}</strong></div><div class="stat red"><small>المتبقي</small><strong>${r14Due(fee(p.code)-paid(p.code),true)}</strong></div></div><div class="panel"><h2>تكليفات المصممين</h2><div class="tablewrap"><table><thead><tr><th>المصمم</th><th>التكليف</th><th class="num">الأتعاب</th><th class="num">المدفوع</th><th class="num">المتبقي</th><th>الإجراءات</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.designer)}</td><td>${esc(x.kind)}</td><td class="num">${fmt(x.fee)}</td><td class="num">${r14Paid(paid(p.code,x.designer))}</td><td class="num" function paymentList(){return `<div class="panel"><div class="panel-title"><h2>كل الدفعات (${data.payments.length})</h2><button class="btn primary" onclick="openPayment()">+ تسجيل دفعة</button></div><div class="filters"><input id="searchPay" class="field" placeholder="بحث باسم المصمم، المشروع، السند..." oninput="filterPay()"></div><div id="payRows">${payTable([...data.payments].sort((a,b)=>String(b.date).localeCompare(String(a.date))))}</div></div>`}

function reports(){return `<div class="panel"><h2>إعداد كشف حساب</h2><div class="filters"><select id="reportDesigner" class="field" onchange="updateReport()"><option value="">جميع المصممين</option>${designers().map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join('')}</select><select id="reportProject" class="field" onchange="updateReport()"><option value="">جميع المشاريع</option>${data.projects.map(p=>`<option value="${esc(p.code)}">${esc(p.code)} - ${esc(p.name)}</option>`).join('')}</select><button class="btn" onclick="window.print()">طباعة الكشف</button><button class="btn primary" onclick="exportCSV()">تصدير CSV</button><button class="btn" onclick="exportAllExcel()">Excel شامل</button></div><div id="reportData"></div></div>`}
function reportRows(){let d=$('reportDesigner')?.value||'',c=$('reportProject')?.value||'';return data.assignments.filter(x=>(!c||x.code===c)&&(!d||x.designer===d))}function updateReport(){let rows=reportRows(),sumF=rows.reduce((s,x)=>s+Number(x.fee),0),sumP=rows.reduce((s,x)=>s+paid(x.code,x.designer),0);$('reportData').innerHTML=`<div class="cards" style="margin:20px 0"><div class="minicard"><small>إجمالي المستحق</small><strong>${money(sumF)}</strong></div><div class="minicard"><small>إجمالي المدفوع</small><strong>${r14Paid(sumP,true)}</strong></div><div class="minicard"><small>الرصيد</small><strong>${r14Due(sumF-sumP,true)}</strong></div></div><div class="tablewrap"><table><thead><tr><th>المشروع</th><th>المصمم</th><th class="num">الأتعاب</th><th class="num">المدفوع</th><th class="num">المتبقي</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.designer)}</td><td class="num">${fmt(x.fee)}</td><td class="num">${r14Paid(paid(x.code,x.designer))}</td><td class="num">${r14Due(x.fee-paid(x.code,x.designer))}</td></tr>`).join('')}</tbody></table></div>`}

function modal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('overlay').classList.add('open')};function closeModal(){$('overlay').classList.remove('open')};function val(id){return $(id).value.trim()};function field(id,title,value='',type='text',extra=''){return `<label>${title}<input class="field" id="${id}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function editProject(encoded){let p=encoded?getP(decodeURIComponent(encoded)):null;modal(p?'تعديل المشروع':'إضافة مشروع',`<form onsubmit="saveProject(event,'${p?r14Encode(p.code):''}')"><div class="formgrid">${field('pcode','كود المشروع',p?.code||'','text','required')}${field('pname','اسم المشروع',p?.name||'','text','required')}${field('pclient','اسم العميل',p?.client||'')}${field('pkind','نوع العمل',p?.kind||'')}${field('psite','موقع المشروع',p?.site||'')}${field('pcontract','قيمة عقد العميل (جنيه)',p?.contract||0,'number','min="0" step="0.01"')}${field('pstate','حالة المشروع',p?.state||'نشط')}<label class="full">ملاحظات<textarea id="pnote" class="field" rows="2">${esc(p?.note||'')}</textarea></label></div><div class="modalfoot"><button class="btn primary" type="submit">حفظ المشروع</button><button class="btn" type="button" onclick="closeModal()">إلغاء</button></div></form>`)}
function saveProject(e,original){e.preventDefault();let code=val('pcode');if(!code||!val('pname'))return alert('الكود واسم المشروع مطلوبان');const old=original?decodeURIComponent(original):null;if(data.projects.some(p=>p.code===code&&p.code!==old))return alert('كود المشروع مستخدم بالفعل');let obj={...(old?getP(old):{}),code,name:val('pname'),client:val('pclient'),kind:val('pkind'),site:val('psite'),contract:Number(val('pcontract'))||0,state:val('pstate'),note:val('pnote')};if(old){let index=data.projects.findIndex(p=>p.code===old);data.projects[index]=obj;if(code!==old){data.assignments.forEach(a=>{if(a.code===old)a.code=code});data.payments.forEach(p=>{if(p.code===old)p.code=code});data.claims.forEach(p=>{if(p.code===old)p.code=code;if(p.projectRows)p.projectRows.forEach(r=>{if(r.code===old)r.code=code})});data.clientReceipts.forEach(p=>{if(p.code===old)p.code=code});if(projectFocus===old)projectFocus=code}}else data.projects.push(obj);save();closeModal();render();notify('تم حفظ المشروع بنجاح')}
function editAssignment(encoded,desEnc){let c=encoded?decodeURIComponent(encoded):'',d=desEnc?decodeURIComponent(desEnc):'',old=d?getA(c,d):null;modal(old?'تعديل تكليف مصمم':'تكليف مصمم بمشروع',`<form onsubmit="saveAssignment(event,'${r14Encode(c)}','${r14Encode(d)}')"><div class="formgrid"><label>المشروع<select id="acode" class="field" required ${old?'disabled':''}><option value="">اختر المشروع</option>${data.projects.map(p=>`<option value="${esc(p.code)}" ${p.code===c?'selected':''}>${esc(p.code)} · ${esc(p.name)}</option>`).join('')}</select></label>${field('adesigner','اسم المصمم',d,'text',old?'readonly required':'required')}${field('afee','قيمة الأتعاب بالجنيه',old?.fee||0,'number','min="0" step="0.01" required')}${field('akind','نطاق التكليف',old?.kind||'تصميم')}</div><div class="modalfoot"><button class="btn primary" type="submit">حفظ التكليف</button><button type="button" class="btn" onclick="closeModal()">إلغاء</button></div></form>`)}
function saveAssignment(e,c,d){e.preventDefault();let code=val('acode'),name=val('adesigner'),amount=Number(val('afee'));if(!code||!name||!Number.isFinite(amount)||amount<0)return alert('راجع بيانات التكليف');let old=d?getA(decodeURIComponent(c),decodeURIComponent(d)):getA(code,name);if(old&&!d)return alert('المصمم مكلف بهذا المشروع بالفعل، يمكنك تعديل التكليف');if(old){old.fee=amount;old.kind=val('akind')}else data.assignments.push({id:'D-'+Date.now(),code,designer:name,fee:amount,kind:val('akind')});save();closeModal();render();notify('تم حفظ تكليف المصمم')}
function openPayment(codeEnc,desEnc,idEnc){let existing=idEnc?data.payments.find(p=>p.id===decodeURIComponent(idEnc)):null,c=existing?.code||(codeEnc?decodeURIComponent(codeEnc):''),d=existing?.designer||(desEnc?decodeURIComponent(desEnc):'');modal(existing?'تعديل دفعة مسجلة':'تسجيل دفعة مصمم',`<form onsubmit="savePayment(event,'${existing?r14Encode(existing.id):''}')"><div class="formgrid"><label>المشروع<select class="field" id="paycode" onchange="syncDesigners()" required ${existing?'disabled':''}><option value="">اختر المشروع</option>${data.projects.map(p=>`<option value="${esc(p.code)}" ${p.code===c?'selected':''}>${esc(p.code)} — ${esc(p.name)}</option>`).join('')}</select></label><label>المصمم<select id="paydesigner" class="field" required ${existing?'disabled':''}></select></label>${field('paydate','تاريخ الدفعة',existing?.date||r14Today(),'date','required')}${field('payamount','المبلغ بالجنيه',existing?.amount||'','number','min="1" step="0.01" required')}<label>طريقة الدفع<select id="paymethod" class="field">${['تحويل بنكي','نقدي','محفظة إلكترونية','دفعة سابقة','أخرى'].map(x=>`<option ${x===(existing?.method||'تحويل بنكي')?'selected':''}>${x}</option>`).join('')}</select></label>${field('payref','رقم المرجع / السند',existing?.ref||'')}<label class="full">ملاحظات<textarea id="paynote" class="field" rows="2">${esc(existing?.note||'')}</textarea></label></div><div id="balanceHint" class="notice" style="margin-top:15px"></div><div class="modalfoot"><button class="btn primary" type="submit">${existing?'حفظ التعديل':'حفظ الدفعة'}</button><button type="button" class="btn" onclick="closeModal()">إلغاء</button></div></form>`);syncDesigners(d);$('payamount').addEventListener('input',balanceHint)}
function syncDesigners(selected){let c=val('paycode'),list=data.assignments.filter(a=>a.code===c);$('paydesigner').innerHTML='<option value="">اختر المصمم</option>'+list.map(a=>`<option value="${esc(a.designer)}" ${a.designer===selected?'selected':''}>${esc(a.designer)}</option>`).join('');$('paydesigner').onchange=balanceHint;balanceHint()}

function savePayment(e,id){e.preventDefault();let old=id?data.payments.find(p=>p.id===decodeURIComponent(id)):null,c=val('paycode'),d=val('paydesigner'),amount=Number(val('payamount')),date=val('paydate');if(!getA(c,d))return alert('يجب تكليف المصمم بالمشروع أولًا');if(!amount||amount<=0||!date)return alert('المبلغ والتاريخ مطلوبان');let available=fee(c,d)-paid(c,d)+(old?Number(old.amount):0);if(amount>available&&!confirm('الدفعة أكبر من الرصيد المستحق للمصمم. هل تريد حفظها رغم ذلك؟'))return;let obj={id:old?.id||'PAY-'+Date.now(),code:c,designer:d,date,amount,method:val('paymethod'),ref:val('payref'),note:val('paynote')};if(old){let i=data.payments.indexOf(old);obj.history=(old.history||[]).concat([{changed:new Date().toISOString(),previousAmount:old.amount,previousDate:old.date}]);data.payments[i]=obj}else data.payments.push(obj);save();closeModal();render();notify(old?'تم تعديل الدفعة وحفظ سجل التعديل':'تم تسجيل الدفعة بنجاح')}
function download(name,txt,mime){let b=new Blob([txt],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}

function restoreData(input){let file=input.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let v=JSON.parse(reader.result);if(!Array.isArray(v.projects)||!Array.isArray(v.assignments)||!Array.isArray(v.payments))throw Error('format');if(!confirm('سيتم استبدال كل البيانات الحالية بالنسخة المختارة. هل أنت متأكد؟'))return;data={...v,projects:v.projects,assignments:v.assignments,payments:v.payments,claims:Array.isArray(v.claims)?v.claims:[],clientReceipts:Array.isArray(v.clientReceipts)?v.clientReceipts:[]};save();go('dashboard');notify('تمت استعادة البيانات')}catch(e){alert('ملف النسخة الاحتياطية غير صالح')}};reader.readAsText(file);input.value=''}
function exportCSV(){let r=reportRows(),rows=[['المشروع','المصمم','الأتعاب','المدفوع','المتبقي'],...r.map(x=>[x.code,x.designer,x.fee,paid(x.code,x.designer),x.fee-paid(x.code,x.designer)])];download('RONIX_Designer_Statement.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}

// Customer claims, separate from contractor/designer costs.
function claimsFor(code){return data.claims.filter(x=>!code||x.code===code)}
function receiptFor(code){return data.clientReceipts.filter(x=>!code||x.code===code)}
function claimed(code){return claimsFor(code).reduce((n,c)=>n+Number(c.total||0),0)}
function received(code){return receiptFor(code).reduce((n,r)=>n+Number(r.amount||0),0)}
function clientProjectPanel(p){let cs=claimsFor(p.code),rs=receiptFor(p.code),c=r14Encode(p.code);return `<div class="panel"><div class="panel-title"><h2>حساب العميل والمطالبات</h2><div class="row-actions"><button class="btn primary" onclick="openClaim('${c}')">+ مطالبة</button><button class="btn" onclick="openReceipt('${c}')">+ دفعة مستلمة</button><button class="btn" onclick="projectExcel('${c}')">تصدير Excel</button></div></div><div class="claim-kpis"><div class="minicard"><small>قيمة العقد</small><strong>${money(p.contract)}</strong></div><div class="minicard"><small>مطالبات صادرة / معتمدة</small><strong>${money(claimed(p.code))}</strong></div><div class="minicard"><small>المحصّل من العميل</small><strong>${r14Paid(received(p.code),true)}</strong></div><div class="minicard"><small>رصيد العقد بعد التحصيل</small><strong>${r14Due(Number(p.contract||0)-received(p.code),true)}</strong></div></div><div class="claim-section"><div class="claim-title">المطالبات الصادرة</div>${claimTable(cs)}</div><div class="claim-section"><div class="claim-title">دفعات العملاء المستلمة</div>${receiptTable(rs)}</div><p class="hint">المطالبة مستقلة عن القبض. افتح «مطابقة» لربط السندات بالمطالبة وعرض المسدد والمتبقي.</p></div>`}
function claimTable(cs){return `<div class="tablewrap"><table><thead><tr><th>الرقم</th><th>المشروع</th><th>التاريخ</th><th>الحالة</th><th class="num">قيمة المطالبة</th><th>إجراءات</th></tr></thead><tbody>${cs.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.code)}</td><td>${esc(x.date)}</td><td>${esc(x.status)}</td><td class="num">${fmt(x.total)}</td><td><button class="link" onclick="printClaim('${r14Encode(x.id)}')">طباعة</button><button class="link" onclick="openClaim(null,'${r14Encode(x.id)}')">تعديل</button></td></tr>`).join('')||'<tr><td colspan="6">لا توجد مطالبات حتى الآن</td></tr>'}</tbody></table></div>`}
function receiptTable(rs){return `<div class="tablewrap"><table><thead><tr><th>رقم السند</th><th>التاريخ</th><th>طريقة التحصيل</th><th class="num">القيمة</th><th>مستند التحويل</th><th>إجراء</th></tr></thead><tbody>${rs.map(x=>`<tr><td>${esc(x.ref||x.id)}</td><td>${esc(x.date)}</td><td>${esc(x.method)}</td><td class="num">${r14Paid(x.amount)}</td><td>${r14ProofAction('receipt',r14ReceiptProofKey(x))}</td><td><button class="link" onclick="openReceipt(null,'${r14Encode(x.id)}')">تعديل</button></td></tr>`).join('')||'<tr><td colspan="6">لا توجد دفعات مستلمة</td></tr>'}</tbody></table></div>`}
function claimList(){return `<div class="grid"><div class="stat"><small>مطالبات العملاء</small><strong>${data.claims.length}</strong></div><div class="stat gold"><small>مطالبات صادرة / معتمدة</small><strong>${money(claimed())}</strong></div><div class="stat green"><small>المستلم من العملاء</small><strong>${r14Paid(received(),true)}</strong></div><div class="stat red"><small>فرق المطالبات والتحصيل</small><strong>${money(claimed()-received())}</strong></div></div><div class="panel"><div class="panel-title"><h2>مطالبات العملاء</h2><div class="actions"><button class="btn primary" onclick="openClaim()">+ مطالبة جديدة</button><button class="btn" onclick="openReceipt()">+ تسجيل تحصيل</button><button class="btn" onclick="exportAllExcel()">Excel شامل</button></div></div>${claimTable(data.claims)}</div><div class="panel"><h2>التحصيل من العملاء</h2>${receiptTable(data.clientReceipts)}</div>`}

function claimParseLines(rawText){let raw=String(rawText||'').split(/\r?\n/).filter(x=>x.trim()),items=[],errors=[];for(let i=0;i<raw.length;i++){let line=raw[i].replace(/—/g,'-');let parts=line.split('|');if(parts.length!==2){errors.push(`السطر ${i+1}: استخدم الصيغة "الوصف | المبلغ"`);continue}let desc=parts[0].trim(),amount=Number(parts[1].trim().replace(/,/g,''));if(!desc)errors.push(`السطر ${i+1}: الوصف فارغ`);else if(!Number.isFinite(amount)||amount<=0)errors.push(`السطر ${i+1}: المبلغ غير صحيح`);else items.push({desc,amount})}return {items,errors}}
function claimSelectedProject(){let code=val('claimCode');return getP(code)||null}
function claimSideCard(){const p=claimSelectedProject(),img=p?cover(p):null;const rows=claimParseLines(val('claimItems'));const total=rows.items.reduce((n,x)=>n+x.amount,0);const due=val('claimDue')||'غير محدد';const status=val('claimStatus')||'مسودة';return `<div class="claim-sidecard"><h3 style="margin:0 0 8px">معاينة المطالبة</h3><div style="font-size:13px;color:#667085">مرتبطة بالمشروع والعميل الحاليين</div>${img?`<img src="${img.src}" alt="صورة المشروع">`:'<div style="margin-top:10px;height:160px;display:flex;align-items:center;justify-content:center;border:1px dashed #cbd5e1;border-radius:14px;background:#fff;color:#94a3b8">لا توجد صورة للمشروع</div>'}<div class="meta"><div><b>المشروع:</b> ${esc(p?.name||'—')} <br><small>${esc(p?.code||'')}</small></div><div><b>العميل:</b> ${esc(p?.client||'—')}</div><div><b>تاريخ المطالبة:</b> ${esc(val('claimDate')||'—')}</div><div><b>الاستحقاق:</b> ${esc(due)} · <b>الحالة:</b> ${esc(status)}</div></div><div class="claim-totals"><div class="claim-mini"><small>عدد البنود</small><strong>${rows.items.length}</strong></div><div class="claim-mini"><small>إجمالي المطالبة</small><strong>${money(total)}</strong></div><div class="claim-mini"><small>قيمة العقد</small><strong>${money(Number(p?.contract||0))}</strong></div></div><div class="claim-preview-lines">${rows.errors.length?`<div style="color:#b42318">${rows.errors.map(e=>`• ${esc(e)}`).join('<br>')}</div>`:rows.items.map((it,i)=>`${i+1}) ${esc(it.desc)} — <b>${fmt(it.amount)}</b>`).join('<br>')||'أضف بنود المطالبة ليظهر الملخص هنا.'}</div></div>`}
function refreshClaimPreview(){const box=$('claimSidePreview');if(box)box.innerHTML=claimSideCard()}
function initClaimForm(){['claimCode','claimDate','claimDue','claimStatus','claimItems'].forEach(id=>{const el=$(id);if(el){el.oninput=refreshClaimPreview;el.onchange=refreshClaimPreview}});refreshClaimPreview()}
function openClaim(codeEnc,idEnc){let old=idEnc?data.claims.find(x=>x.id===decodeURIComponent(idEnc)):null,c=old?.code||(codeEnc?decodeURIComponent(codeEnc):'');let lines=old?.items?.map(x=>x.desc+' | '+x.amount).join('\n')||'';modal(old?'تعديل مطالبة عميل':'مطالبة مالية جديدة',`<form onsubmit="saveClaim(event,'${old?r14Encode(old.id):''}')"><div class="claim-form-grid"><div><div class="formgrid"><label>المشروع<select class="field" id="claimCode" required ${old?'disabled':''}><option value="">اختر مشروعًا</option>${data.projects.map(p=>`<option value="${esc(p.code)}" ${c===p.code?'selected':''}>${esc(p.code)} — ${esc(p.name)} / ${esc(p.client)}</option>`).join('')}</select></label>${field('claimDate','تاريخ المطالبة',old?.date||r14Today(),'date','required')}<label>حالة المطالبة<select id="claimStatus" class="field">${['مسودة','صادرة','معتمدة','ملغاة'].map(x=>`<option ${x===(old?.status||'مسودة')?'selected':''}>${x}</option>`).join('')}</select></label>${field('claimDue','تاريخ الاستحقاق',old?.due||'','date')}</div><label class="full" style="display:block;margin-top:12px">بنود المطالبة: بند واحد بكل سطر (الوصف | المبلغ)<textarea class="field" id="claimItems" rows="8" required placeholder="أعمال شوب دروينج | 12000&#10;ملحق أعمال إضافية | 3000">${esc(lines)}</textarea></label><label class="full" style="display:block;margin-top:12px">ملاحظات<textarea class="field" id="claimNote" rows="3" placeholder="أي ملاحظات أو شروط إضافية">${esc(old?.note||'')}</textarea></label><p class="hint">يمكن إصدار أكثر من مطالبة للمشروع، وإضافة بنود أو ملحقات. لا تُسجل المطالبة كدفعة مستلمة.</p></div><div id="claimSidePreview"></div></div><div class="modalfoot claim-actions">${old?`<button type="button" class="btn secondary" onclick="printClaim('${r14Encode(old.id)}')">🖨 طباعة المطالبة</button>`:''}<button class="btn primary" type="submit">حفظ المطالبة</button><button type="button" class="btn" onclick="closeModal()">إلغاء</button></div></form>`);setTimeout(initClaimForm,0)}
function saveClaim(ev,id){ev.preventDefault();let old=id?data.claims.find(x=>x.id===decodeURIComponent(id)):null,c=old?.code||val('claimCode');if(!getP(c))return alert('اختر مشروعًا صالحًا');let parsed=claimParseLines(val('claimItems'));if(parsed.errors.length)return alert(parsed.errors[0]);if(!parsed.items.length)return alert('أضف بندًا واحدًا على الأقل');let obj={id:old?.id||'CL-'+r14Today().replace(/-/g,'')+'-'+String(Date.now()).slice(-5),code:c,date:val('claimDate'),due:val('claimDue'),status:val('claimStatus'),note:val('claimNote'),items:parsed.items,total:parsed.items.reduce((n,x)=>n+x.amount,0)};if(old)data.claims[data.claims.indexOf(old)]=obj;else data.claims.push(obj);if(!save())return;closeModal();render();notify('تم حفظ المطالبة')}
function printClaim(idEnc){const x=data.claims.find(c=>c.id===decodeURIComponent(idEnc));if(!x)return;const p=getP(x.code)||{};const img=cover(p);let html=`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>مطالبة ${esc(x.id)}</title><style>@page{size:A4;margin:12mm}body{font-family:Tahoma,Arial;color:#1d293b;padding:0}*{box-sizing:border-box}.sheet{border:1px solid #d9e1ea;border-radius:18px;padding:18px 22px}.top{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start;border-bottom:3px solid #b58a48;padding-bottom:16px}.brand{font-weight:900;font-size:34px;color:#a17b41;letter-spacing:3px}.sub{color:#667085;font-size:12px}.title{font-size:28px;color:#13243a;margin:0}.top-right{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}.photo{width:220px;height:150px;border:1px solid #d5dde5;border-radius:14px;overflow:hidden;background:#f8fafc;display:flex;align-items:center;justify-content:center}.photo img{width:100%;height:100%;object-fit:cover}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.meta div{border:1px solid #e1e7ef;border-radius:12px;padding:10px 12px;background:#fafbfd;font-size:14px}.note-box{margin:10px 0 0;padding:10px 12px;border:1px dashed #d6b97c;background:#fffaf1;border-radius:12px;font-size:13px;color:#5f4a1c}table{width:100%;border-collapse:collapse;margin-top:18px}th{background:#1c2b41;color:#fff}td,th{border:1px solid #d5dde5;padding:10px 12px;text-align:right;font-size:14px}tfoot td{background:#f3f4f6;font-weight:700}.foot{margin-top:40px;display:flex;justify-content:space-between;gap:20px}.sign{flex:1;border-top:1px solid #cbd5e1;padding-top:12px;text-align:center}.water{margin-top:8px;color:#98a2b3;font-size:11px}.totals{display:flex;justify-content:flex-end;margin-top:12px}.total-box{min-width:240px;border:1px solid #d7dee8;background:#f8fafc;border-radius:14px;padding:12px 14px}.total-box strong{font-size:24px;color:#102a43;display:block;margin-top:4px}</style></head><body><div class="sheet"><div class="top"><div><div class="brand">RONIX</div><div class="sub">RONIX ENGINEERING · Client Financial Claim</div><h1 class="title">مطالبة مالية</h1><div class="water">رقم المطالبة: ${esc(x.id)} · الحالة: ${esc(x.status||'—')}</div></div><div class="top-right"><div class="photo">${img?`<img src="${img.src}" alt="صورة المشروع">`:'<span style="color:#98a2b3;font-size:13px">لا توجد صورة للمشروع</span>'}</div></div></div><div class="meta"><div><b>العميل:</b> ${esc(p.client||'—')}</div><div><b>التاريخ:</b> ${esc(x.date)}</div><div><b>المشروع:</b> ${esc(p.name||'')} · ${esc(x.code)}</div><div><b>تاريخ الاستحقاق:</b> ${esc(x.due||'غير محدد')}</div><div><b>نوع / نطاق المشروع:</b> ${esc(p.kind||'—')}</div><div><b>الموقع:</b> ${esc(p.site||'—')}</div></div><table><thead><tr><th style="width:52px">م</th><th>وصف البند</th><th style="width:180px">المبلغ (ج.م)</th></tr></thead><tbody>${x.items.map((it,i)=>`<tr><td>${i+1}</td><td>${esc(it.desc)}</td><td>${fmt(it.amount)}</td></tr>`).join('')}</tbody></table><div class="totals"><div class="total-box"><span>إجمالي المطالبة</span><strong>${money(x.total)}</strong></div></div>${x.note?`<div class="note-box"><b>ملاحظات:</b> ${esc(x.note)}</div>`:''}<div class="foot"><div class="sign">إعداد الحسابات</div><div class="sign">اعتماد الإدارة / العميل</div></div></div><scr${"ipt"}>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`;let w=window.open('','_blank');if(!w)return alert('اسمح بالنوافذ المنبثقة للطباعة');w.document.open();w.document.write(html);w.document.close()}

// Excel 2003 Spreadsheet XML: offline multi-tab workbook, no external services.
function excelXML(tabs){let xml='<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="head"><Font ss:Bold="1"/><Interior ss:Color="#E8EDF5" ss:Pattern="Solid"/></Style></Styles>';for(let [title,rows] of tabs){xml+='<Worksheet ss:Name="'+xmlEsc(title.slice(0,31))+'"><Table>';rows.forEach((row,i)=>{xml+='<Row>';row.forEach(v=>{const isN=typeof v==='number'&&Number.isFinite(v);xml+='<Cell'+(i===0?' ss:StyleID="head"':'')+'><Data ss:Type="'+(isN?'Number':'String')+'">'+xmlEsc(v)+'</Data></Cell>'});xml+='</Row>'});xml+='</Table></Worksheet>'}return xml+'</Workbook>'}
function xmlEsc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
function exportTabs(tabs,name='RONIX_Export'){download(name+'.xls','﻿'+excelXML(tabs),'application/vnd.ms-excel;charset=utf-8');notify('تم تصدير ملف Excel')}
function projectExcel(encoded){const code=decodeURIComponent(encoded),p=getP(code);if(!p)return;exportTabs([['المشروع',[['الكود','المشروع','العميل','قيمة العقد'],[p.code,p.name,p.client,Number(p.contract)||0]]],['المطالبات',[['رقم المطالبة','التاريخ','الحالة','البند','القيمة'],...claimsFor(code).flatMap(c=>c.items.map(i=>[c.id,c.date,c.status,i.desc,i.amount]))]],['تحصيل العميل',[['السند','التاريخ','المبلغ','الطريقة'],...receiptFor(code).map(r=>[r.ref||r.id,r.date,r.amount,r.method])]],['المصممون',[['المصمم','الأتعاب','المدفوع','المتبقي'],...data.assignments.filter(a=>a.code===code).map(a=>[a.designer,Number(a.fee),paid(code,a.designer),Number(a.fee)-paid(code,a.designer)])]],['دفعات المصممين',[['التاريخ','المصمم','القيمة','السند'],...data.payments.filter(x=>x.code===code).map(x=>[x.date,x.designer,Number(x.amount),x.ref||x.id])]]],'RONIX_'+code+'_Accounts')}
function exportAllExcel(){exportTabs([['المشاريع',[['الكود','المشروع','العميل','قيمة العقد','مطالبات','المحصّل'],...data.projects.map(p=>[p.code,p.name,p.client,Number(p.contract)||0,claimed(p.code),received(p.code)])]],['المطالبات',[['الرقم','المشروع','العميل','التاريخ','الحالة','الوصف','المبلغ'],...data.claims.flatMap(c=>c.items.map(it=>[c.id,c.code,getP(c.code)?.client||'',c.date,c.status,it.desc,it.amount]))]],['دفعات العملاء',[['المشروع','التاريخ','المبلغ','الطريقة','المرجع'],...data.clientReceipts.map(r=>[r.code,r.date,Number(r.amount),r.method,r.ref])]],['مستحقات المصممين',[['المشروع','المصمم','الأتعاب','المدفوع','المتبقي'],...data.assignments.map(a=>[a.code,a.designer,Number(a.fee),paid(a.code,a.designer),Number(a.fee)-paid(a.code,a.designer)])]],['دفعات المصممين',[['المشروع','المصمم','التاريخ','المبلغ'],...data.payments.map(p=>[p.code,p.designer,p.date,Number(p.amount)])]]],'RONIX_Finance_Export')}

titles.clients=['كشف حساب العملاء','كشف موحّد لكل عميل مع توزيع التحصيلات على مشروعاته'];
function clientNames(){return [...new Set(data.projects.map(x=>(x.client||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'))}
function customerProjects(name){return data.projects.filter(p=>(p.client||'').trim()===name)}
function customerTotals(name){let ps=customerProjects(name);return {contracts:ps.reduce((n,p)=>n+Number(p.contract||0),0),receipts:data.clientReceipts.filter(r=>r.client===name||(!r.client&&ps.some(p=>p.code===r.code))).reduce((n,r)=>n+Number(r.amount||0),0),claims:ps.reduce((n,p)=>n+claimed(p.code),0)}}
function customerLedger(){let names=clientNames();return `<div class="panel"><div class="panel-title"><h2>كشف حساب العملاء</h2><div class="actions"><button class="btn primary" onclick="openCustomerReceipt()">+ قبض وتوزيع على مشاريع</button><button class="btn" onclick="exportClientSummary()">Excel جميع العملاء</button></div></div><div class="filters"><select class="field" id="clientSelect" onchange="displayClientLedger()"><option value="">اختر العميل لعرض كشفه</option>${names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select></div><p class="hint">الرصيد = مجموع العقود − المبالغ المحصّلة. والمطالبات تُعرض منفصلة حتى لا تُضاف مرتين لقيمة العقد.</p></div><div id="customerLedgerArea">${clientSummaryTable()}</div>`}
function clientSummaryTable(){return `<div class="panel"><h2>ملخص العملاء</h2><div class="tablewrap"><table><thead><tr><th>العميل</th><th>المشاريع</th><th>قيمة العقود</th><th>المحصّل</th><th>الرصيد</th><th>الكشف</th></tr></thead><tbody>${clientNames().map(n=>{let t=customerTotals(n);return `<tr><td>${esc(n)}</td><td>${customerProjects(n).length}</td><td>${fmt(t.contracts)}</td><td>${r14Paid(t.receipts)}</td><td>${r14Due(t.contracts-t.receipts)}</td><td><button class="link" onclick="selectClient('${r14Encode(n)}')">فتح</button></td></tr>`}).join('')}</tbody></table></div></div>`}

function displayClientLedger(){let n=val('clientSelect');let target=$('customerLedgerArea');if(!n){target.innerHTML=clientSummaryTable();return}let ps=customerProjects(n),t=customerTotals(n);let rs=data.clientReceipts.filter(r=>r.client===n||(!r.client&&ps.some(p=>p.code===r.code))).sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.id).localeCompare(String(b.id)));let grouped=new Map();rs.forEach(r=>{let key=r.batchId||r.id;if(!grouped.has(key))grouped.set(key,{id:key,proofKey:r14ReceiptProofKey(r),date:r.date,method:r.method,ref:r.ref,note:r.note,amount:0,projects:[]});let x=grouped.get(key);x.amount+=Number(r.amount||0);x.projects.push(`${r.code||'غير موزع'}: ${fmt(r.amount)}`)});let enc=r14Encode(n);target.innerHTML=`<div class="panel"><div class="panel-title"><h2>كشف حساب / ${esc(n)}</h2><div class="actions"><button class="btn primary" onclick="openCustomerReceipt('${enc}')">+ تسجيل دفعة</button><button class="btn" onclick="printCustomerStatement('${enc}')">طباعة A4 / PDF</button><button class="btn" onclick="exportCustomerStatement('${enc}')">Excel الكشف</button></div></div><div class="claim-kpis"><div class="minicard"><small>قيمة عقود العميل</small><strong>${money(t.contracts)}</strong></div><div class="minicard"><small>التحصيل المخصص للمشاريع</small><strong>${r14Paid(t.receipts,true)}</strong></div><div class="minicard"><small>الرصيد المتبقي</small><strong>${r14Due(t.contracts-t.receipts,true)}</strong></div><div class="minicard"><small>المطالبات المسجلة</small><strong>${money(t.claims)}</strong></div></div><h3>أرصدة المشاريع</h3><div class="tablewrap"><table><thead><tr><th>كود</th><th>المشروع</th><th>قيمة العقد</th><th>المدفوع</th><th>المتبقي</th><th>فتح</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${fmt(p.contract)}</td><td>${r14Paid(received(p.code))}</td><td><b>${r14Due(Number(p.contract||0)-received(p.code))}</b></td><td><button class="link" onclick="page='projects';openProject('${r14Encode(p.code)}')">فتح</button></td></tr>`).join('')}</tbody></table></div><h3 style="margin-top:25px">دفعات العميل (السند يظهر مرة واحدة)</h3><div class="tablewrap"><table><thead><tr><th>رقم السند</th><th>التاريخ</th><th>المبلغ</th><th>التوزيع</th><th>الطريقة</th><th>مستند التحويل</th><th>تصحيح</th></tr></thead><tbody>${[...grouped.values()].map(x=>`<tr><td>${esc(x.ref||x.id)}</td><td>${esc(x.date)}</td><td>${r14Paid(x.amount)}</td><td>${esc(x.projects.join('، '))}</td><td>${esc(x.method||'')}</td><td>${r14ProofAction('receipt',x.proofKey)}</td><td><button class="link" onclick="editCustomerReceipt('${r14Encode(x.id)}')">تعديل</button></td></tr>`).join('')||'<tr><td colspan="7">لا توجد تحصيلات بعد</td></tr>'}</tbody></table></div></div>`}
let activeReceiptEdit=null;
function openCustomerReceipt(enc='',batchEnc=''){let name=enc?decodeURIComponent(enc):'',old=batchEnc?decodeURIComponent(batchEnc):null;activeReceiptEdit=old;let oldItems=old?data.clientReceipts.filter(r=>(r.batchId||r.id)===old):[];if(!name&&oldItems.length)name=oldItems[0].client||oldItems[0].client||getP(oldItems[0].code)?.client||'';let first=oldItems[0];modal(old?'تعديل سند قبض العميل':'سند قبض جديد وتوزيعه على المشاريع',`<form onsubmit="saveCustomerReceipt(event)"><div class="formgrid"><label class="full">العميل<select id="crClient" class="field" required onchange="refreshReceiptAllocations()"><option value="">اختر العميل</option>${clientNames().map(n=>`<option value="${esc(n)}" ${n===name?'selected':''}>${esc(n)}</option>`).join('')}</select></label>${field('crDate','تاريخ القبض',first?.date||r14Today(),'date','required')}${field('crAmount','إجمالي السند بالجنيه',oldItems.reduce((n,r)=>n+Number(r.amount),0)||'','number','min="1" step="0.01" required oninput="checkAllocationTotal()"')}<label>طريقة التحصيل<select class="field" id="crMethod">${['تحويل بنكي','نقدي','محفظة','شيك','أخرى'].map(m=>`<option ${m===(first?.method||'تحويل بنكي')?'selected':''}>${m}</option>`).join('')}</select></label>${field('crRef','رقم السند / مرجع التحويل',first?.ref||'')}<label class="full">ملاحظات<textarea id="crNote" class="field" rows="2">${esc(first?.note||'')}</textarea></label></div><h3>توزيع السند على المشاريع</h3><div id="crAllocations"></div><div class="notice" id="crCheck">التوزيع اختياري. أي مبلغ غير موزع يُحفظ كرصيد للعميل.</div><div class="modalfoot"><button class="btn primary" type="submit">${old?'حفظ تصحيح السند':'حفظ السند والخصم'}</button><button class="btn" type="button" onclick="closeModal()">إلغاء</button></div></form>`);refreshReceiptAllocations(oldItems)}
function refreshReceiptAllocations(existing=[]){let name=val('crClient');let ps=customerProjects(name);let olds=new Map(existing.filter(x=>x.code).map(x=>[x.code,Number(x.amount)]));$('crAllocations').innerHTML=ps.length?`<div class="tablewrap"><table><thead><tr><th>المشروع</th><th>رصيد قبل السند</th><th>تخصيص المبلغ</th></tr></thead><tbody>${ps.map(p=>{let old=olds.get(p.code)||0;return `<tr><td>${esc(p.code)} — ${esc(p.name)}</td><td>${fmt(Number(p.contract||0)-received(p.code)+old)}</td><td><input class="field receipt-allocation" style="max-width:175px" data-code="${esc(p.code)}" type="number" min="0" step="0.01" value="${old||''}" placeholder="0" oninput="checkAllocationTotal()"></td></tr>`}).join('')}</tbody></table></div>`:'<p class="hint">لا توجد مشاريع مرتبطة بهذا العميل.</p>';checkAllocationTotal()}
function checkAllocationTotal(){let sum=[...document.querySelectorAll('.receipt-allocation')].reduce((a,x)=>a+(Number(x.value)||0),0),amount=Number($('crAmount')?.value||0),rest=amount-sum,el=$('crCheck');if(el){el.style.color=rest < -0.001?'#b33d4a':'#187a56';el.textContent=`إجمالي السند: ${money(amount)} | موزع على المشاريع: ${money(sum)} | رصيد غير موزع: ${money(Math.max(0,rest))}${rest < -0.001?' — التوزيع أكبر من السند، عدّله':' — يمكنك الحفظ دون توزيع كامل المبلغ'}`}}

function saveCustomerReceipt(e){e.preventDefault();let client=val('crClient'),date=val('crDate'),total=Number(val('crAmount')),fields=[...document.querySelectorAll('.receipt-allocation')],all=fields.map(f=>({code:f.dataset.code,amount:Number(f.value||0)})),allocations=all.filter(x=>x.amount>0),sum=allocations.reduce((a,x)=>a+x.amount,0);if(!client||!date||!Number.isFinite(total)||total<=0||all.some(x=>!Number.isFinite(x.amount)||x.amount<0)||sum>total+0.001)return alert('أدخل مبلغ سند موجبًا؛ لا يجوز أن يتجاوز التوزيع إجمالي السند');if(allocations.some(x=>getP(x.code)?.client?.trim()!==client))return alert('تخصيص لمشروع تابع لعميل آخر مرفوض');let old=activeReceiptEdit?data.clientReceipts.filter(r=>(r.batchId||r.id)===activeReceiptEdit):[];let avail=allocations.filter(x=>x.amount>Number(getP(x.code).contract||0)-received(x.code)+old.filter(o=>o.code===x.code).reduce((n,o)=>n+Number(o.amount),0)+0.001);if(avail.length&&!confirm('أحد المشاريع سيصبح رصيده سالبًا. هل تريد المتابعة؟'))return;let batch=activeReceiptEdit||'RC-'+Date.now(),previous=old.length?JSON.parse(JSON.stringify(old)):null,retained=data.clientReceipts.filter(r=>(r.batchId||r.id)!==batch),unallocated=Math.max(0,Math.round((total-sum)*100)/100),base={batchId:batch,client,date,method:val('crMethod'),ref:val('crRef')||batch,note:val('crNote'),history:previous?[{at:new Date().toISOString(),previous},...(old[0]?.history||[])]:[]};let newRows=allocations.map((a,i)=>({...base,id:batch+'-'+(i+1),code:a.code,amount:a.amount}));if(unallocated>0.001)newRows.push({...base,id:batch+'-UNALLOC',code:'',amount:unallocated,unallocated:true});data.clientReceipts=retained.concat(newRows);if(!save()){data.clientReceipts=retained.concat(old);return}closeModal();activeReceiptEdit=null;render();notify('تم حفظ سند القبض؛ الرصيد غير الموزع محفوظ باسم العميل');}

function editCustomerReceipt(enc){let id=decodeURIComponent(enc),items=data.clientReceipts.filter(r=>(r.batchId||r.id)===id);if(!items.length)return;if(items.some(r=>r.sourceAdvanceId))return alert('هذا تخصيص لدفعة مقدمة، ولا يجوز تعديله من سند قبض عادي حتى لا يختل رصيد المقدمة.');openCustomerReceipt(r14Encode(items[0].client||getP(items[0].code)?.client||''),enc)}

function printCustomerStatement(enc){let n=decodeURIComponent(enc),ps=customerProjects(n),t=customerTotals(n);let html=`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>كشف حساب ${esc(n)}</title><style>@page{size:A4;margin:14mm}body{font:13px Tahoma,Arial;color:#1c293b}header{display:flex;justify-content:space-between;border-bottom:3px solid #b08a4f;padding-bottom:14px;margin-bottom:20px}.brand{font-size:30px;letter-spacing:3px;font-weight:bold;color:#ad854b}h1{font-size:21px;margin:0}h2{font-size:15px;margin-top:26px}table{border-collapse:collapse;width:100%;margin:12px 0}th,td{border:1px solid #d9dfe7;padding:9px;text-align:right}th{background:#263a52;color:white}tr{break-inside:avoid}p{line-height:1.8}.totals{background:#f4f5f7;padding:12px}footer{margin-top:50px;display:flex;justify-content:space-between}</style></head><body><header><div class="brand">RONIX</div><div><h1>كشف حساب عميل</h1><div>التاريخ: ${r14Today()}</div></div></header><p><b>السادة / ${esc(n)}</b></p><p class="totals"><b>إجمالي العقود:</b> ${money(t.contracts)} &nbsp; | &nbsp; <b>الدفعات المستلمة:</b> ${r14Paid(t.receipts,true)} &nbsp; | &nbsp; <b>الرصيد:</b> ${r14Due(t.contracts-t.receipts,true)}</p><h2>المشاريع</h2><table><tr><th>كود المشروع</th><th>المشروع</th><th>العقد</th><th>المستلم</th><th>الرصيد</th></tr>${ps.map(p=>`<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${fmt(p.contract)}</td><td>${r14Paid(received(p.code))}</td><td>${r14Due(Number(p.contract||0)-received(p.code))}</td></tr>`).join('')}</table><h2>حركة التحصيل وتوزيع السندات</h2><table><tr><th>السند</th><th>التاريخ</th><th>المشروع</th><th>الدفعة المخصصة</th></tr>${data.clientReceipts.filter(r=>ps.some(p=>p.code===r.code)).sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(r=>`<tr><td>${esc(r.ref||r.batchId||r.id)}</td><td>${esc(r.date)}</td><td>${esc(r.code)}</td><td>${fmt(r.amount)}</td></tr>`).join('')}</table><footer><span>إعداد الحسابات: ______________</span><span>اعتماد: _______ function clientAdvances(n){return data.advances.filter(a=>a.client===n)}
function unallocated(n){return clientAdvances(n).reduce((v,a)=>v+Math.round((Number(a.total)-Number(a.allocated||0))*100),0)/100}

function dueClaims(n){let today=r14Today();return data.claims.filter(c=>customerProjects(n).some(p=>p.code===c.code)&&['صادرة','معتمدة'].includes(c.status)&&c.due&&c.due<today)}
function verifiedClaims(n){return data.claims.filter(c=>customerProjects(n).some(p=>p.code===c.code)&&['صادرة','معتمدة'].includes(c.status))}
function advancedFinance(){let names=clientNames(),receipts=[...new Set(data.clientReceipts.map(r=>r.batchId||r.id))];return `<div class="panel"><div class="panel-title"><h2>*** مركز الحسابات والتحصيل</h2><div class="actions"><button class="btn primary" onclick="openAdvance()">+ دفعة مقدمة غير موزعة</button><button class="btn" onclick="openOpening()">+ رصيد افتتاحي</button><button class="btn" onclick="openCustomerReceipt()">+ سند قبض موزع</button></div></div><p class="hint">الدفعة المقدمة تُحفظ على حساب العميل ولا تُخصم من مشروع حتى تخصصها. تحويل المقدمة إلى مشروع لا ينشئ تحصيلاً نقدياً جديداً. الرصيد الافتتاحي يظهر للتسوية فقط ولا يُضاف إلى العقود تلقائياً منعاً للازدواج.</p><div class="tablewrap"><table><thead><tr><th>العميل</th><th>العقود</th><th>المحصل للمشاريع</th><th>مقدم غير موزع</th><th>مطالبات صادرة / معتمدة</th><th>مطالبات تجاوزت تاريخ الاستحقاق</th><th>إجراءات</th></tr></thead><tbody>${names.map(n=>{let t=customerTotals(n),over=dueClaims(n);return `<tr><td>${esc(n)}</td><td>${fmt(t.contracts)}</td><td>${r14Paid(t.receipts)}</td><td>${fmt(unallocated(n))}</td><td>${fmt(verifiedClaims(n).reduce((a,c)=>a+Number(c.total||0),0))}</td><td style="color:#b04b48">${over.length} / ${r14Due(over.reduce((a,c)=>a+R14.remaining(data,c),0))}</td><td><button class="link" onclick="openAdvancedClient('${r14Encode(n)}')">كشف وتوزيع</button></td></tr>`}).join('')}</tbody></table></div></div><div id="advancedDetail"></div><div class="panel"><h2>*** مرفقات إيصالات العملاء</h2><p class="hint">يمكنك إضافة صورة أو PDF صغير لكل سند. استخدم النسخة الاحتياطية لحفظ المستندات؛ الحد الأقصى للملف 2 ميجابايت.</p><div class="tablewrap"><table><thead><tr><th>السند</th><th>العميل</th><th>رفع ملف</th><th>عرض المرفق</th></tr></thead><tbody>${receipts.map(id=>{let r=data.clientReceipts.find(x=>(x.batchId||x.id)===id),client=r.client||getP(r.code)?.client||'',proofKey=r14ReceiptProofKey(r),f=data.receiptAttachments[proofKey];return `<tr><td>${esc(r.ref||id)}</td><td>${esc(client)}</td><td><input type="file" accept="image/*,application/pdf" onchange="saveReceiptAttachment('${r14Encode(proofKey)}',this)"></td><td>${f?`<button class="link" onclick="showReceiptAttachment('${r14Encode(proofKey)}')">فتح ${esc(f.name)}</button>`:'لا يوجد'}</td></tr>`}).join('')}</tbody></table></div></div>`}
function openAdvance(){modal('*** قبض مقدم غير موزع',`<form onsubmit="saveAdvance(event)"><div class="formgrid"><label>العميل<select id="adClient" class="field" required><option value="">اختر العميل</option>${clientNames().map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select></label>${field('adDate','تاريخ القبض',r14Today(),'date','required')}${field('adTotal','المبلغ المستلم','', 'number','min="0.01" step="0.01" required')}${field('adRef','مرجع التحويل / السند','')}<label class="full">ملاحظة<input id="adNote" class="field"></label></div><div class="modalfoot"><button class="btn primary" type="submit">حفظ المقدمة</button></div></form>`)}
function saveAdvance(e){e.preventDefault();let client=val('adClient'),total=cleanMoney(val('adTotal'));if(!clientNames().includes(client)||!Number.isFinite(total)||total<=0||!val('adDate'))return alert('راجع بيانات القبض');let a={id:'ADV-'+Date.now(),client,total,allocated:0,date:val('adDate'),ref:val('adRef'),note:val('adNote'),allocations:[]};data.advances.push(a);if(!save()){data.advances.pop();return}closeModal();render();notify('تم حفظ القبض المقدم بدون خصمه من مشاريع العميل')}
function openOpening(){modal('*** تسوية رصيد افتتاحي',`<form onsubmit="saveOpening(event)"><div class="formgrid"><label>العميل<select class="field" id="obClient" required><option value="">اختر العميل</option>${clientNames().map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select></label>${field('obDate','تاريخ افتتاح الحساب',r14Today(),'date','required')}${field('obAmount','الرصيد المدين (+) أو الدائن (-)','','number','step="0.01" required')}<label class="full">مرجع التسوية<input class="field" id="obNote"></label></div><p class="hint">قيمة مرجعية مستقلة للكشف الزمني. لا تُضاف لعقود المشاريع منعاً لتكرار مستحقات قد تكون مدرجة.</p><div class="modalfoot"><button class="btn primary" type="submit">حفظ التسوية</button></div></form>`)}
function saveOpening(e){e.preventDefault();let client=val('obClient'),amount=Number(val('obAmount'));if(!clientNames().includes(client)||!Number.isFinite(amount)||!val('obDate'))return alert('راجع الرصيد');let prev=data.openingBalances.find(x=>x.client===client),old=prev?{...prev}:null;data.openingBalances=data.openingBalances.filter(x=>x.client!==client);data.openingBalances.push({client,date:val('obDate'),amount:cleanMoney(amount),note:val('obNote')});if(!save()){data.openingBalances=data.openingBalances.filter(x=>x.client!==client);if(old)data.openingBalances.push(old);return}closeModal();render();notify('حُفظ الرصيد الافتتاحي كمرجع منفصل')}
function openAdvancedClient(enc){let n=decodeURIComponent(enc),ps=customerProjects(n),adv=clientAdvances(n),opening=data.openingBalances.find(x=>x.client===n),encN=r14Encode(n);let el=$('advancedDetail');if(!el)return;el.innerHTML=`<div class="panel"><div class="panel-title"><h2>*** ${esc(n)} — دفعات مقدمة وكشف فترة</h2><div class="actions"><button class="btn" onclick="exportPeriod('${encN}')">Excel الفترة</button><button class="btn" onclick="printPeriod('${encN}')">طباعة الكشف</button></div></div><div class="formgrid"><label>من تاريخ<input id="finFrom" type="date" class="field"></label><label>إلى تاريخ<input id="finTo" type="date" class="field" value="${r14Today()}"></label></div><p class="hint">الرصيد الافتتاحي المُدخل: ${opening?money(opening.amount)+' بتاريخ '+esc(opening.date):'لم يُدخل'}، ويُعرض منفصلاً عن رصيد العقود لحين المطابقة.</p><h3>مقدمات العميل — المتاح للتوزيع: ${money(R14.sum(clientAdvances(n),a=>R14.delta(a.total,a.allocated||0)))}</h3><div class="tablewrap"><table><thead><tr><th>المرجع</th><th>التاريخ</th><th>المبلغ</th><th>الموزع</th><th>المتبقي</th><th>مستند التحويل</th><th>إجراء</th></tr></thead><tbody>${adv.map(a=>`<tr><td>${esc(a.ref||a.id)}</td><td>${esc(a.date)}</td><td>${r14Paid(a.total)}</td><td>${r14Paid(a.allocated)}</td><td>${fmt(a.total-a.allocated)}</td><td>${r14ProofAction('receipt',a.id)}</td><td>${a.total-a.allocated>.001?`<button class="link" onclick="openApplyAdvance('${r14Encode(a.id)}')">توزيع المقدمة</button>`:'موزعة بالكامل'}</td></tr>`).join('')||'<tr><td colspan="7">لا توجد دفعات مقدمة</td></tr>'}</tbody></table></div><h3>تفصيل رصيد المشاريع</h3><div class="tablewrap"><table><thead><tr><th>المشروع</th><th>العقد</th><th>المحصّل</th><th>المتبقي</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.code)} — ${esc(p.name)}</td><td>${fmt(p.contract)}</td><td>${r14Paid(received(p.code))}</td><td>${r14Due(p.contract-received(p.code))}</td></tr>`).join('')}</tbody></table></div><p class="hint">تنبيه: تجاوز المطالبة تاريخ استحقاقها لا يعني أن قيمتها بالكامل متأخرة؛ يلزم مطابقة المطالبات بالمقبوضات قبل اعتماد قيمة المتأخر الفعلي.</p></div>`}
function openApplyAdvance(enc){let id=decodeURIComponent(enc),a=data.advances.find(x=>x.id===id);if(!a)return;let ps=customerProjects(a.client);modal('*** توزيع مقدمة عميل على المشاريع',`<form onsubmit="applyAdvance(event,'${enc}')"><p>السند ${esc(a.ref||a.id)} — المتاح: <b>${money(a.total-a.allocated)}</b></p><div class="tablewrap"><table><thead><tr><th>المشروع</th><th>رصيد العقد</th><th>المبلغ المخصص</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.code)} — ${esc(p.name)}</td><td>${r14Due(Number(p.contract)-received(p.code))}</td><td><input type="number" min="0" step="0.01" class="field apply-advance" data-code="${esc(p.code)}" value="0"></td></tr>`).join('')}</tbody></table></div><p class="hint">سيُخصم التوزيع من المقدمة الموجودة بالفعل، وليس قبضًا جديدًا.</p><div class="modalfoot"><button class="btn primary" type="submit">اعتماد التوزيع</button></div></form>`)}
function applyAdvance(e,enc){e.preventDefault();let a=data.advances.find(x=>x.id===decodeURIComponent(enc));if(!a)return;let rows=[...document.querySelectorAll('.apply-advance')].map(x=>({code:x.dataset.code,amount:cleanMoney(x.value)})).filter(x=>x.amount>0),sum=cleanMoney(rows.reduce((n,x)=>n+x.amount,0));if(!sum||!Number.isFinite(sum)||sum>cleanMoney(a.total-a.allocated)+.001||rows.some(r=>!getP(r.code)||getP(r.code).client!==a.client||r.amount>cleanMoney(Number(getP(r.code).contract)-received(r.code))+.001))return alert('التوزيع أكبر من المبلغ المتاح أو رصيد مشروع؛ راجع الأرقام');let oldAlloc=a.allocated,oldRows=[...(a.allocations||[])],newRows=rows.map((r,i)=>({id:a.id+'-AL-'+Date.now()+'-'+i,batchId:a.id+'-ALLOC-'+Date.now(),code:r.code,amount:r.amount,date:r14Today(),method:'تسوية مقدمة سابقة',ref:a.ref||a.id,note:'توزيع دون تحصيل جديد — '+a.id,sourceAdvanceId:a.id}));a.allocated=cleanMoney(a.allocated+sum);a.allocations=[...oldRows,...newRows.map(x=>({code:x.code,amount:x.amount,date:x.date}))];data.clientReceipts.push(...newRows);if(!save()){a.allocated=oldAlloc;a.allocations=oldRows;data.clientReceipts=data.clientReceipts.filter(r=>!newRows.includes(r));return}closeModal();render();notify('تم توزيع المقدم دون إضافة قبض نقدي جديد')}
function saveReceiptAttachment(enc,input){let id=decodeURIComponent(enc),file=input.files?.[0];if(!file)return;if(file.size>1024*1024)return alert('الحد الأقصى للمرفق 1 ميجابايت');if(!file.type.startsWith('image/')&&file.type!=='application/pdf')return alert('يسمح بصورة أو PDF فقط');let reader=new FileReader();reader.onload=()=>{let previous=data.receiptAttachments[id];data.receiptAttachments[id]={name:file.name,mime:file.type,data:reader.result};if(!save()){if(previous)data.receiptAttachments[id]=previous;else delete data.receiptAttachments[id];return}render();notify('تم حفظ المرفق مع نسخة البيانات الاحتياطية')};reader.readAsDataURL(file)}
function showReceiptAttachment(enc){let f=data.receiptAttachments[decodeURIComponent(enc)];if(!f)return;let a=document.createElement('a');a.href=f.data;a.download=f.name;document.body.appendChild(a);a.click();a.remove()}
function periodRows(n){let ps=customerProjects(n),codes=new Set(ps.map(p=>p.code)),from=val('finFrom')||'0000-01-01',to=val('finTo')||'9999-12-31',open=data.openingBalances.find(x=>x.client===n);if(from>to)throw Error('تاريخ البداية بعد تاريخ النهاية');let rows=[];for(let c of data.claims)if(['صادرة','معتمدة'].includes(c.status)&&c.date<=to)for(const r of (c.projectRows||[{code:c.code,amount:c.total}]))if(codes.has(r.code))rows.push({date:c.date,ref:c.id,code:r.code,type:'مطالبة',debit:Number(r.amount),credit:0});for(let r of data.clientReceipts)if(codes.has(r.code)&&r.date<=to)rows.push({date:r.date,ref:r.ref||r.id,code:r.code,type:r.sourceAdvanceId?'تخصيص دفعة مقدمة':'قبض مخصص',debit:0,credit:Number(r.amount)});for(let r of data.clientReceipts)if(!r.code&&r.client===n&&r.date<=to)rows.push({date:r.date,ref:r.ref||r.id,code:'—',type:'قبض غير موزع (معلومة: '+money(r.amount)+')',debit:0,credit:0});for(let a of clientAdvances(n))if(a.date<=to)rows.push({date:a.date,ref:a.ref||a.id,code:'—',type:'قبض مقدمة (معلومة: '+money(a.total)+')',debit:0,credit:0});rows.sort((a,b)=>a.date.localeCompare(b.date)||a.ref.localeCompare(b.ref));let before=rows.filter(r=>r.date<from),during=rows.filter(r=>r.date>=from),openingCalc=before.reduce((v,r)=>v+r.debit-r.credit,0);return {from,to,open,openingCalc,during}}
function periodTabs(enc){let n=decodeURIComponent(enc),r=periodRows(n),rolling=r.openingCalc;let rows=r.during.map(x=>{rolling+=x.debit-x.credit;return [x.date,x.ref,x.code,x.type,x.debit,x.credit,cleanMoney(rolling)]});return [['كشف حركة الفترة',[['العميل','من','إلى','حركة سابقة (للعناصر المسجلة فقط)','رصيد افتتاحي مرجعي منفصل'],[n,r.from,r.to,cleanMoney(r.openingCalc),r.open?.amount??'غير محدد'],[],['التاريخ','المرجع','المشروع','الحركة','مدين/مطالبات','دائن/تخصيصات','رصيد حركة المطالبات'],...rows,[],['ملاحظات','الرصيد المتولد من الحركات لا يُساوي بالضرورة رصيد العقود. المقدمات وأجزاء السندات غير الموزعة لا تدخل في التحصيل المخصص.']]],['دفعات مقدمة',[['المرجع','التاريخ','قيمة القبض','ما تم تخصيصه','المتبقي'],...clientAdvances(n).map(a=>[a.ref||a.id,a.date,a.total,a.allocated,cleanMoney(a.total-a.allocated)])]] ]}
function exportPeriod(enc){try{exportTabs(periodTabs(enc),'RONIX_Client_Period_'+r14Today())}catch(e){alert(e.message)}}
function printPeriod(enc){let n=decodeURIComponent(enc),tabs;try{tabs=periodTabs(enc)}catch(e){return alert(e.message)}let html=`<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>RONIX كشف فترة</title><style>@page{size:A4 landscape;margin:12mm}body{font:12px Tahoma,Arial;color:#233347}h1{color:#b08a4f}table{border-collapse:collapse;width:100%}td,th{border:1px solid #d8e0e8;padding:7px;text-align:right}tr:nth-child(even){background:#f4f6f8}tr{break-inside:avoid}</style><h1>RONIX | كشف حركة حساب عميل</h1><h2>${esc(n)}</h2><p>التقرير تحليلي: المطالبات والتحصيلات المخصصة، وليس رصيد حسابات أستاذ مُراجع.</p><table>${tabs[0][1].map((row,i)=>`<tr>${row.map(v=>`<${i===3?'th':'td'}>${esc(String(v??''))}</${i===3?'th':'td'}>`).join('')}</tr>`).join('')}</table>`;let w=window.open('','_blank');if(!w)return alert('اسمح بالنوافذ المنبثقة');w.document.write(html);w.document.close();w.focus();w.print()}
const v3render=render;render=function(){data.advances=Array.isArray(data.advances)?data.advances:[];data.openingBalances=Array.isArray(data.openingBalances)?data.openingBalances:[];data.receiptAttachments=data.receiptAttachments&&typeof data.receiptAttachments==='object'?data.receiptAttachments:{};if(page==='advanced'){$('content').innerHTML=advancedFinance();return}return v3render()};

<style>
.cc-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.cc-kpi{display:grid;grid-template-columns:repeat(4,minmax(145px,1fr));gap:12px;margin:16px 0}.cc-kpi>div{background:#fff;border:1px solid #e0e5ed;border-radius:14px;padding:17px}.cc-kpi small{display:block;color:#667587;font-size:12px}.cc-kpi b{display:block;margin-top:9px;font-size:22px;color:#172337}.cc-section{border-right:4px solid #b58a48;padding-right:12px;margin:18px 0}.cc-note{background:#f5f7fa;border:1px solid #e0e5ed;padding:12px;border-radius:9px;font-size:12px;line-height:2;color:#526175}.cc-split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.cc-amount{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}.cc-tab{border:0;border-radius:9px;padding:11px 18px;background:#f0f3f7;color:#172337;font-weight:bold;cursor:pointer}.cc-tab.active{background:#172337;color:white}@media(max-width:850px){.cc-kpi{grid-template-columns:repeat(2,1fr)}.cc-split{grid-template-columns:1fr}}

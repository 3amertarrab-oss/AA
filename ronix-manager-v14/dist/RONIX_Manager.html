<script>
// V4 cost-centre layer. A project is the unique cost-centre key; designer fees are commitments, not cash expenses.
if(!Array.isArray(data.projectExpenses))data.projectExpenses=[];
if(!Array.isArray(data.costAudit))data.costAudit=[];
titles.costcenters=['*** مراكز التكلفة','كل مشروع كوحدة مالية مستقلة: تعاقد · تحصيل · التزامات · مصروفات'];
titles.dashboard=['لوحة الإدارة','المشاريع ومراكز التكلفة والسيولة والمستحقات — بدون خلط بين الإيراد والتكلفة'];
function ccAmounts(code){
 const p=getP(code);if(!p)return null;
 const contract=Number(p.contract)||0,receipts=received(code),committed=fee(code),designerCash=paid(code);
 const extra=data.projectExpenses.filter(x=>x.code===code).reduce((n,x)=>n+Number(x.amount||0),0);
 const verified=claimsFor(code).filter(x=>['معتمد','صادر','approved','issued'].includes(String(x.status||'').toLowerCase())).reduce((n,x)=>n+Number(x.total||0),0);
 return {contract,receipts,committed,designerCash,extra,verified,contractRemaining:contract-receipts,
 projectedProfit:contract-committed-extra,operatingCash:receipts-designerCash-extra,projectCosts:committed+extra};
}
function ccKpi(title,value,help,accent=''){return `<div><small>${title}</small><b class="${r14MetricTone(title)}" style="${accent?'color:'+accent:''}">${money(value)}</b><small>${help}</small></div>`}
function ccProjectCard(p){const a=ccAmounts(p.code),enc=r14Encode(p.code);return `<tr><td><button class="link" onclick="go('projects');openProject('${enc}')">${esc(p.code)}</button></td><td>${esc(p.name)}</td><td>${esc(p.client||'—')}</td><td class="cc-amount">${fmt(a.contract)}</td><td class="cc-amount">${r14Paid(a.receipts)}</td><td class="cc-amount">${r14Due(a.contractRemaining)}</td><td class="cc-amount">${fmt(a.projectCosts)}</td><td class="cc-amount" style="color:${a.projectedProfit<0?'#b33d4a':'#087c69'}">${fmt(a.projectedProfit)}</td><td><button class="link" onclick="showCostCenter('${enc}')">تفاصيل</button></td></tr>`}
function ccTable(list){return `<div class="tablewrap"><table><thead><tr><th>الكود</th><th>المشروع</th><th>العميل</th><th>العقد</th><th>المحصّل</th><th>متبقي العقد</th><th>التكاليف والالتزامات</th><th>هامش تقديري</th><th>فتح</th></tr></thead><tbody>${list.map(ccProjectCard).join('')||'<tr><td colspan="9">لا توجد مشاريع</td></tr>'}</tbody></table></div>`}
function costcenters(){const arr=data.projects;let t={contract:0,receipts:0,rem:0,cost:0,profit:0};for(let p of arr){let a=ccAmounts(p.code);t.contract+=a.contract;t.receipts+=a.receipts;t.rem+=a.contractRemaining;t.cost+=a.projectCosts;t.profit+=a.projectedProfit}return `<div class="panel"><div class="cc-head"><div><h2>*** مراكز التكلفة | المشاريع</h2><div class="subtitle">كل مشروع مركز تكلفة مستقل مرتبط بكود المشروع</div></div><div class="actions"><button class="btn" onclick="exportCostCenters()">↓ تصدير Excel</button><button class="btn primary" onclick="editProject()">+ مشروع</button></div></div><div class="cc-kpi">${ccKpi('قيمة العقود',t.contract,'إجمالي قيمة المشاريع')}${ccKpi('المحصّل المخصص',t.receipts,'قبض موزع على المشاريع','#087c69')}${ccKpi('المتبقي من العقود',t.rem,'غير محصّل؛ ليس كله مستحقًا الآن','#b33d4a')}${ccKpi('هامش تقديري',t.profit,'قبل المصروفات غير المسجلة')}</div><div class="filters"><input class="field" id="ccSearch" placeholder="ابحث بالكود أو المشروع أو العميل" oninput="ccFilter()"></div><div id="ccTable">${ccTable(arr)}</div><p class="cc-note">*** تنبيه محاسبي: «التكاليف والالتزامات» = إجمالي أتعاب المصممين المتعاقد عليها + المصروفات الإضافية المسجلة؛ ولا تُضاف دفعات المصممين مرة ثانية. «الهامش التقديري» ليس صافي ربح معتمدًا. المقدمات غير الموزعة لا تخصم من رصيد مشروع.</p></div><div id="ccDetail"></div>`}
function ccFilter(){let q=($('ccSearch')?.value||'').toLowerCase();$('ccTable').innerHTML=ccTable(data.projects.filter(p=>[p.code,p.name,p.client].some(x=>String(x||'').toLowerCase().includes(q))))}
function showCostCenter(enc){let p=getP(decodeURIComponent(enc));if(!p)return;let a=ccAmounts(p.code),expenses=data.projectExpenses.filter(x=>x.code===p.code).sort((x,y)=>String(y.date).localeCompare(String(x.date)));if(page!=='costcenters'){go('costcenters')}let el=$('ccDetail');if(!el)return;el.innerHTML=`<div class="panel"><div class="cc-head"><div><h2>${esc(p.code)} — ${esc(p.name)}</h2><div class="subtitle">${esc(p.client||'لا يوجد عميل')} · مركز تكلفة مستقل</div></div><div class="actions"><button class="btn primary" onclick="openProjectExpense('${enc}')">+ تسجيل مصروف</button><button class="btn" onclick="go('projects');openProject('${enc}')">فتح بطاقة المشروع والصور</button><button class="btn" onclick="exportCostCenter('${enc}')">Excel المركز</button></div></div><div class="cc-kpi">${ccKpi('قيمة العقد',a.contract,'التعاقد الأصلي')}${ccKpi('مطالبات معتمدة / صادرة',a.verified,'ليست إيرادًا نقديًا')}${ccKpi('المحصّل',a.receipts,'دفعات موزعة على المشروع','#087c69')}${ccKpi('متبقي العقد',a.contractRemaining,'لا يعادل المتأخر المستحق','#b33d4a')}${ccKpi('أتعاب المصممين',a.committed,'التزامات مالية')}${ccKpi('مدفوع للمصممين',a.designerCash,'تدفق نقدي خارج')}${ccKpi('مصروفات أخرى',a.extra,'مصروفات مسجلة')}${ccKpi('هامش تقديري',a.projectedProfit,'قيمة العقد ناقص الالتزامات والمصروفات',a.projectedProfit<0?'#b33d4a':'#087c69')}</div><div class="cc-split"><div><h3 class="cc-section">المصروفات الإضافية</h3><div class="tablewrap"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>المبلغ</th><th>المرجع</th><th>إجراء</th></tr></thead><tbody>${expenses.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.category)}</td><td>${fmt(x.amount)}</td><td>${esc(x.ref||'—')}</td><td><button class="link" onclick="editProjectExpense('${r14Encode(x.id)}')">تعديل</button></td></tr>`).join('')||'<tr><td colspan="5">لا توجد مصروفات إضافية</td></tr>'}</tbody></table></div></div><div><h3 class="cc-section">تفسير الحساب</h3><p class="cc-note">التكلفة المخططة = أتعاب المصممين (${money(a.committed)}) + المصروفات الأخرى (${money(a.extra)}).<br>الحركة النقدية التشغيلية المسجلة = المحصّل (${r14Paid(a.receipts,true)}) − دفعات المصممين (${r14Paid(a.designerCash,true)}) − المصروفات الأخرى (${money(a.extra)}) = <strong>${money(a.operatingCash)}</strong>.<br>أي تكاليف تصنيع أو موقع غير مسجلة لا تظهر في هذه الأرقام. لا تخلط المصروفات الأخرى مع دفعات المصممين.</p></div></div></div>`;el.scrollIntoView({behavior:'smooth',block:'start'})}
function openProjectExpense(enc='',eid=''){let p=enc?getP(decodeURIComponent(enc)):null,x=eid?data.projectExpenses.find(z=>z.id===decodeURIComponent(eid)):null;modal(x?'*** تعديل مصروف المشروع':'*** إضافة مصروف لمركز تكلفة',`<form onsubmit="saveProjectExpense(event,'${x?r14Encode(x.id):''}')"><div class="formgrid"><label>المشروع<select class="field" id="ccExpProject" required ${p||x?'disabled':''}>${data.projects.map(z=>`<option value="${esc(z.code)}" ${(p||x)&&z.code===(p?.code||x.code)?'selected':''}>${esc(z.code)} — ${esc(z.name)}</option>`).join('')}</select></label><label>نوع المصروف<select id="ccExpCategory" class="field">${['مقاول باطن','تصنيع','تركيب','نقل','مواد','زيارات موقع','مصروف إداري محمل','أخرى'].map(v=>`<option ${x?.category===v?'selected':''}>${v}</option>`).join('')}</select></label>${field('ccExpDate','التاريخ',x?.date||r14Today(),'date','required')}${field('ccExpAmount','المبلغ',x?.amount||'','number','min="0.01" step="0.01" required')}${field('ccExpRef','مرجع / إيصال',x?.ref||'')}<label class="full">ملاحظات<input class="field" id="ccExpNotes" value="${esc(x?.notes||'')}"></label></div><p class="cc-note">لا تسجل هنا دفعات المصمم الموجودة بالفعل في قسم المصممين، حتى لا تتكرر التكلفة.</p><div class="modalfoot"><button type="submit" class="btn primary">حفظ المصروف</button></div></form>`)}
function editProjectExpense(id){openProjectExpense('',id)}
function saveProjectExpense(e,id){e.preventDefault();let old=id?data.projectExpenses.find(x=>x.id===decodeURIComponent(id)):null,code=old?.code||$('ccExpProject').value,amount=Number($('ccExpAmount').value);if(!getP(code)||!Number.isFinite(amount)||amount<=0)return alert('راجع المشروع والمبلغ');let v={id:old?.id||'EXP-'+Date.now(),code,date:$('ccExpDate').value,category:$('ccExpCategory').value,amount:Math.round(amount*100)/100,ref:$('ccExpRef').value.trim(),notes:$('ccExpNotes').value.trim()};if(old){data.costAudit.push({at:new Date().toISOString(),action:'edit expense',before:{...old},after:{...v}});Object.assign(old,v)}else{data.projectExpenses.push(v);data.costAudit.push({at:new Date().toISOString(),action:'add expense',after:{...v}})}if(!save()){if(old)return;data.projectExpenses.pop();data.costAudit.pop();return}closeModal();render();if(page==='costcenters')showCostCenter(r14Encode(code));notify('تم حفظ المصروف على مركز تكلفة المشروع')}
function exportCostCenters(){let rows=[['الكود','المشروع','العميل','العقد','المحصّل','متبقي العقد','أتعاب المصممين','مدفوع للمصممين','مصروفات أخرى','التكلفة والالتزامات','الهامش التقديري'],...data.projects.map(p=>{let a=ccAmounts(p.code);return[p.code,p.name,p.client,a.contract,a.receipts,a.contractRemaining,a.committed,a.designerCash,a.extra,a.projectCosts,a.projectedProfit]})];exportTabs([['مراكز التكلفة',rows]])}
function exportCostCenter(enc){let p=getP(decodeURIComponent(enc));if(!p)return;let a=ccAmounts(p.code);exportTabs([['ملخص المركز',[['كود المشروع',p.code],['المشروع',p.name],['العميل',p.client],['قيمة العقد',a.contract],['المحصّل',a.receipts],['متبقي العقد',a.contractRemaining],['أتعاب المصممين',a.committed],['دفعات المصممين',a.designerCash],['مصروفات أخرى',a.extra],['هامش تقديري',a.projectedProfit]]],['مصروفات المركز',[['التاريخ','الفئة','القيمة','المرجع','ملاحظة'],...data.projectExpenses.filter(x=>x.code===p.code).map(x=>[x.date,x.category,x.amount,x.ref,x.notes])]]])}
function ccDashboard(){let arr=data.projects.map(p=>({p,a:ccAmounts(p.code)}));let sum=k=>arr.reduce((t,x)=>t+x.a[k],0);let attention=arr.filter(x=>x.a.contractRemaining>0).sort((a,b)=>b.a.contractRemaining-a.a.contractRemaining).slice(0,8);return `<div class="panel"><div class="cc-head"><div><h2>*** لوحة الإدارة المالية</h2><div class="subtitle">إيرادات العقود والتحصيلات والالتزامات لكل مشروع — في شاشة واحدة</div></div><div class="actions"><button class="btn primary" onclick="go('costcenters')">عرض مراكز التكلفة</button><button class="btn" onclick="go('clients')">كشف العملاء</button><button class="btn" onclick="go('advanced')">المقدمات والتسويات</button></div></div><div class="cc-kpi">${ccKpi('العقود',sum('contract'),'قيمة جميع المشاريع')}${ccKpi('المحصّل',sum('receipts'),'مخصص للمشاريع','#087c69')}${ccKpi('متبقي التعاقدات',sum('contractRemaining'),'ليس كله متأخرًا','#b33d4a')}${ccKpi('الهامش التقديري',sum('projectedProfit'),'قبل التكاليف غير المسجلة')}${ccKpi('التزامات المصممين',sum('committed'),'كامل أتعاب التكليف')}${ccKpi('دفعات المصممين',sum('designerCash'),'مدفوع فعلي')}${ccKpi('مصروفات إضافية',sum('extra'),'من مراكز التكلفة')}${ccKpi('صافي التدفق المسجل',sum('operatingCash'),'قبض مخصص ناقص مدفوعات وتكاليف') }</div><p class="cc-note">لا تجمع المدفوع للمصممين مرة ثانية مع التزاماتهم عند حساب الربح؛ مصاريف المشروع المسجلة هنا فقط هي التي تدخل في التكلفة. هذا عرض إداري تقديري وليس قائمة أرباح وخسائر محاسبية نهائية.</p></div><div class="panel"><div class="panel-title"><h2>المشاريع الأعلى في المتبقي من العقد</h2><button class="link" onclick="go('costcenters')">تفاصيل المراكز</button></div>${ccTable(attention.map(x=>x.p))}</div>`}
const ccOldRender=render;render=function(){if(page==='costcenters'&&!projectFocus&&!designerFocus){$('content').innerHTML=costcenters();return}if(page==='dashboard'&&!projectFocus&&!designerFocus){$('content').innerHTML=ccDashboard();return}return ccOldRender()};
const ccOldProject=renderProject;renderProject=function(){ccOldProject();let p=getP(projectFocus);if(p){let el=$('content');let div=document.createElement('div');div.innerHTML=`<div class="panel"><div class="cc-head"><div><h2>*** مركز تكلفة هذا المشروع</h2><p class="subtitle">كل إيراد ومصروف مرتبط بالكود ${esc(p.code)}</p></div><button class="btn primary" onclick="showCostCenter('${r14Encode(p.code)}')">فتح التحليل المالي للمشروع</button></div></div>`;el.insertBefore(div,el.children[1]||null)}};
const ccOldRestore=restoreData;restoreData=function(input){ccOldRestore(input);data.projectExpenses=Array.isArray(data.projectExpenses)?data.projectExpenses:[];data.costAudit=Array.isArray(data.costAudit)?data.costAudit:[]};
const ccNav=document.createElement('button');ccNav.className='nav';ccNav.dataset.page='costcenters';ccNav.innerHTML='<span>▦</span>*** مراكز التكلفة';ccNav.onclick=()=>go('costcenters');let ref=document.querySelector('.nav[data-page="designers"]');ref.parentNode.insertBefore(ccNav,ref);



render();

<style>
/* V5 visual system */
.v5-header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.v5-actions{display:flex;gap:8px;flex-wrap:wrap}.v5-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:15px 0}.v5-metric{background:#fff;border:1px solid #e0e5ed;border-radius:14px;padding:18px;min-width:0}.v5-metric small{display:block;color:#697587;line-height:1.7}.v5-metric strong{font-size:clamp(17px,1.8vw,26px);color:#172337;display:block;margin:9px 0;overflow-wrap:anywhere}.v5-metric em{font-size:11px;color:#7b8795;font-style:normal}.v5-metric.good{border-top:3px solid #14856f}.v5-metric.warn{border-top:3px solid #c79a4b}.v5-metric.bad{border-top:3px solid #b44a53}.v5-bar{display:flex;height:12px;background:#e8edf3;border-radius:15px;overflow:hidden;margin:12px 0 4px}.v5-bar span{background:#14856f;display:block}.v5-subtitle{color:#657286;font-size:13px;line-height:1.9}.v5-chip{border-radius:30px;background:#f1f4f9;color:#293d53;padding:7px 12px;font-weight:600;font-size:12px}.v5-empty{padding:24px;text-align:center;color:#7e8797}@media(max-width:900px){.v5-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.v5-metrics{grid-template-columns:1fr 1fr}.v5-metric{padding:12px}.v5-actions .btn{font-size:12px}}

<script>
// V5: view-only dashboards; single existing ledgers remain source of truth.
const v5Money=(n)=>money(Number(n)||0);
function v5Metric(label,n,sub,kind=''){return `<div class="v5-metric ${kind}"><small>${label}</small><strong class="${r14MetricTone(label)}">${v5Money(n)}</strong><em>${sub||''}</em></div>`}
function v5ClientDashboard(){
 const names=clientNames(), totals=names.map(name=>({name,...customerTotals(name)}));
 const sum=(k)=>totals.reduce((v,x)=>v+x[k],0);
 const advances=names.reduce((n,name)=>n+(typeof unallocated==='function'?Number(unallocated(name)||0):0),0);
 const rows=totals.sort((a,b)=>(b.contracts-b.receipts)-(a.contracts-a.receipts));
 return `<div class="panel"><div class="v5-header"><div><h2>*** لوحة العملاء</h2><div class="v5-subtitle">ملخص الحسابات ومشاريع كل عميل من بيانات العقود والتحصيل الفعلي</div></div><div class="v5-actions"><button class="btn primary" onclick="openCustomerReceipt()">+ سند قبض</button><button class="btn" onclick="exportClientSummary()">↓ Excel العملاء</button></div></div><div class="v5-metrics">${v5Metric('قيمة عقود العملاء',sum('contracts'),'إجمالي قيمة التعاقدات')}${v5Metric('التحصيل المخصص',sum('receipts'),'الموزع بالفعل على المشاريع','good')}${v5Metric('متبقي العقود',sum('contracts')-sum('receipts'),'ليس بالضرورة مستحق السداد الآن','bad')}${v5Metric('أرصدة غير موزعة',advances,'لا تخصم من مشروع قبل تخصيصها','warn')}</div><div class="v5-bar"><span style="width:${sum('contracts')?Math.min(100,Math.max(0,100*sum('receipts')/sum('contracts'))):0}%"></span></div><div class="v5-subtitle">نسبة التحصيل المخصص من العقود: ${sum('contracts')?Math.round(100*sum('receipts')/sum('contracts')):0}%</div></div><div class="panel"><div class="panel-title"><h2>العملاء — الأعلى في الرصيد</h2><span class="v5-chip">${names.length} عميل</span></div><div class="tablewrap"><table><thead><tr><th>العميل</th><th>مشاريع</th><th>العقود</th><th>المقبوض المخصص</th><th>المتبقي</th><th>الملف</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${customerProjects(x.name).length}</td><td>${fmt(x.contracts)}</td><td>${r14Paid(x.receipts)}</td><td>${r14Due(x.contracts-x.receipts)}</td><td><button class="link" onclick="selectClient('${r14Encode(x.name)}')">كشف الحساب ←</button></td></tr>`).join('')||'<tr><td colspan="6" class="v5-empty">لا يوجد عملاء بعد</td></tr>'}</tbody></table></div></div>`;
}
function v5DesignerDashboard(){const names=designers(),a=fee(),b=paid();return `<div class="panel"><div class="v5-header"><div><h2>*** لوحة المصممين</h2><div class="v5-subtitle">الأتعاب التعاقدية والمدفوع لكل مصمم حسب المشروعات المكلف بها</div></div><div class="v5-actions"><button class="btn primary" onclick="openPayment()">+ صرف للمصمم</button><button class="btn" onclick="editAssignment()">+ تكليف جديد</button></div></div><div class="v5-metrics">${v5Metric('إجمالي أتعاب المصممين',a,'التزامات التعاقد')}${v5Metric('المدفوع للمصممين',b,'مصروفات نقدية مدفوعة','good')}${v5Metric('رصيد الأتعاب',a-b,'قد يكون سالبًا في حالة زيادة الدفع','bad')}${v5Metric('متوسط أتعاب المصمم',names.length?a/names.length:0,`${names.length} مصمم / ${data.assignments.length} تكليف`,'warn')}</div><div class="v5-bar"><span style="width:${a?Math.min(100,Math.max(0,100*b/a)):0}%"></span></div><div class="v5-subtitle">نسبة سداد الأتعاب: ${a?Math.round(100*b/a):0}%</div></div><div class="panel"><div class="panel-title"><h2>حسابات المصممين</h2><button class="link" onclick="go('payments')">دفعات المصممين ←</button></div><div class="tablewrap"><table><thead><tr><th>المصمم</th><th>المشاريع</th><th>الأتعاب</th><th>المدفوع</th><th>الرصيد</th><th>الملف</th></tr></thead><tbody>${names.map(name=>`<tr><td><b>${esc(name)}</b></td><td>${data.assignments.filter(x=>x.designer===name).length}</td><td>${fmt(fee('',name))}</td><td>${r14Paid(paid('',name))}</td><td style="color:${fee('',name)<paid('',name)?'#b44a53':''}">${r14Due(fee('',name)-paid('',name))}</td><td><button class="link" onclick="showDesigner('${r14Encode(name)}')">كشف المصمم ←</button></td></tr>`).join('')||'<tr><td colspan="6">لا توجد تكليفات</td></tr>'}</tbody></table></div></div>`}
function v5ProjectsDashboard(){const rows=data.projects.map(p=>({p,a:ccAmounts(p.code)}));const total=k=>rows.reduce((n,x)=>n+x.a[k],0);return `<div class="panel"><div class="v5-header"><div><h2>*** لوحة المشاريع ومراكز التكلفة</h2><div class="v5-subtitle">المشروع هو رابط العميل والمصمم والتكاليف والمستندات</div></div><div class="v5-actions"><button class="btn primary" onclick="editProject()">+ مشروع جديد</button><button class="btn" onclick="go('costcenters')">مراكز التكلفة ←</button></div></div><div class="v5-metrics">${v5Metric('العقود',total('contract'),'قيمة المشاريع')}${v5Metric('التحصيل',total('receipts'),'مقبوضات مخصصة','good')}${v5Metric('تكاليف والتزامات',total('projectCosts'),'أتعاب + مصروفات إضافية','warn')}${v5Metric('هامش تقديري',total('projectedProfit'),'قبل التكاليف غير المسجلة')}</div></div>`}
const v5BeforeRender=render;
render=function(){if(page==='clients'){$('content').innerHTML=v5ClientDashboard()+customerLedger();return}if(page==='designers'&&!designerFocus){$('content').innerHTML=v5DesignerDashboard();return}if(page==='projects'&&!projectFocus){$('content').innerHTML=v5ProjectsDashboard()+projectList();return}v5BeforeRender()};

// V7 interactions and validation
function v7SafeProject(code){return data.projects.some(p=>p.code===code)}
const v7OriginalSaveAssignment=saveAssignment;
saveAssignment=function(e,c,d){
 e.preventDefault();
 const code=val('acode'), name=val('adesigner').replace(/\s+/g,' ').trim();
 const raw=val('afee'), amount=Number(raw);
 if(!v7SafeProject(code)||!name||raw===''||!Number.isFinite(amount)||amount<0)return alert('راجع المشروع واسم المصمم وقيمة الأتعاب');
 const existing=data.assignments.find(x=>x.code===code&&x.designer.trim()===name);
 const original=d?getA(decodeURIComponent(c),decodeURIComponent(d)):null;
 if(existing && existing!==original)return alert('هذا المصمم موجود بالفعل على هذا المشروع. افتح تكليفه لتعديله بدل التكرار.');
 if(original){original.fee=amount;original.kind=val('akind');}
 else data.assignments.push({id:'D-'+Date.now(),code,designer:name,fee:amount,kind:val('akind')});
 if(!save()){if(!original)data.assignments.pop();return;}
 closeModal();render();notify('تم حفظ التكليف وتحديث حساب المشروع والمصمم');
};
// Prevent double submit from clicks while a form handler is executing, even for async handlers.
document.addEventListener('submit',function(e){
 const f=e.target;if(!(f instanceof HTMLFormElement)||!f.closest('#overlay'))return;
 const b=e.submitter;if(!b||b.disabled)return;
 b.disabled=true;b.dataset.oldText=b.textContent;b.textContent='جارٍ المعالجة…';
 setTimeout(()=>{if(b.isConnected){b.disabled=false;b.textContent=b.dataset.oldText||'حفظ'}},900);
},true);
// Visual response to navigation and form changes.
document.addEventListener('click',function(e){let b=e.target.closest('button');if(!b)return;
 if(b.classList.contains('nav')){document.querySelectorAll('.nav').forEach(n=>n.setAttribute('aria-current',n===b?'page':'false'))}
},true);
const v7OldRender=render;
render=function(){v7OldRender();let el=document.getElementById('content');if(el){el.classList.remove('v7-flash');void el.offsetWidth;el.classList.add('v7-flash')}};

// Designer and customer drill-down methods already provided by existing program.

// V6 PATCH: import Excel project images + clearer multi-designer project UI.
const excelPhotoSeed={};
function normProjectCode(code){return String(code||'').trim().replace(/\s*\(.*?\)\s*/g,'').replace(/\s*-\s*.*$/,'').trim();}
function applyExcelProjectPhotos(){let imported=0;for(const p of data.projects){if((p.photos||[]).length)continue;const src=excelPhotoSeed[normProjectCode(p.code)];if(src&&src.length){p.photos=src.map((x,i)=>({id:x.id||('excel-'+normProjectCode(p.code)+'-'+(i+1)),name:x.name||('image-'+(i+1)),src:x.src}));p.coverId=p.coverId||p.photos[0]?.id||'';imported++;}}return imported;}

// *** V8: safe data restore, consistent project codes, resilient dashboard/navigation.
function v8ValidateRestore(v){
 if(!v||typeof v!=='object'||!['projects','assignments','payments'].every(k=>Array.isArray(v[k])))throw Error('missing mandatory ledgers');
 let codes=new Set();
 for(const p of v.projects){if(!p||typeof p.code!=='string'||!p.code.trim()||codes.has(p.code)||!Number.isFinite(Number(p.contract||0)))throw Error('invalid project or duplicate project code');codes.add(p.code)}
 for(const a of v.assignments){if(!codes.has(a.code)||!a.designer||!Number.isFinite(Number(a.fee)))throw Error('invalid designer assignment')}
 for(const pay of v.payments){if(!codes.has(pay.code)||!Number.isFinite(Number(pay.amount)))throw Error('invalid payment')}
 for(const k of ['claims','clientReceipts','advances','openingBalances','projectExpenses','costAudit'])if(v[k]!=null&&!Array.isArray(v[k]))throw Error('invalid '+k);
 return true;
}
restoreData=function(input){
 const file=input.files&&input.files[0];if(!file)return;
 const reader=new FileReader();reader.onload=()=>{
  try{const v=JSON.parse(reader.result);v8ValidateRestore(v);
   if(!confirm('استعادة النسخة ستستبدل كل سجلات البرنامج الحالية. يفضّل تنزيل نسخة احتياطية أولاً. هل تتابع؟'))return;
   const before=data;
   const next=JSON.parse(JSON.stringify(v));
   for(const k of ['claims','clientReceipts','advances','openingBalances','projectExpenses','costAudit','receiptAttachments'])if(!Array.isArray(next[k]))next[k]=[];
   data=next;
   if(!save()){data=before;return;}
   if(typeof applyExcelProjectPhotos==='function'){applyExcelProjectPhotos();save()}
   go('dashboard');notify('تمت استعادة الحسابات والمستخلصات والمرفقات المسجلة في الملف');
  }catch(e){alert('تعذرت الاستعادة: '+e.message)}
 };reader.onerror=()=>alert('تعذر قراءة ملف النسخة الاحتياطية');reader.readAsText(file);input.value='';
};
const v8OldSaveProject=saveProject;
saveProject=function(e,original){
 const prior=original?decodeURIComponent(original):null,updated=val('pcode').trim();
 if(prior&&updated!==prior){
  if(data.projects.some(p=>p.code===updated))return alert('كود المشروع مستخدم بالفعل');
  if(!updated)return alert('كود المشروع مطلوب');
  const oldState=JSON.stringify(data);
  v8OldSaveProject(e,original);
  if(!getP(updated))return;
  for(const key of ['projectExpenses','advances','clientReceipts','claims'])for(const entry of (data[key]||[])){
   if(entry.code===prior)entry.code=updated;
   if(Array.isArray(entry.allocations))for(const allocation of entry.allocations)if(allocation.code===prior)allocation.code=updated;
  }
  if(!save()){data=JSON.parse(oldState);alert('تعذر إكمال تحديث روابط المشروع؛ تمت إعادة البيانات السابقة');}
  return;
 }
 v8OldSaveProject(e,original);
};

 for(const a of data.assignments||[])if(!codes.has(a.code))issues.push('تكليف مرتبط بمشروع غير موجود: '+a.code);
 for(const p of data.payments||[])if(!codes.has(p.code))issues.push('دفعة مصمم بمشروع غير موجود: '+p.code);
 for(const x of data.projectExpenses||[])if(!codes.has(x.code))issues.push('مصروف بمشروع غير موجود: '+x.code);
 const seen=new Set();for(const a of data.assignments||[]){const key=a.code+'::'+a.designer.trim();if(seen.has(key))issues.push('تكليف مصمم مكرر: '+key);seen.add(key)}
 return issues;
}

claimList=function(){const active=data.claims.filter(R14.active),matched=R14.sum(data.claimSettlements),outstanding=R14.delta(R14.sum(active,'total'),matched);return `<div class="v5-metrics">${v5Metric('المطالبات الصادرة والمعتمدة',R14.sum(active,'total'),'المسودات والملغاة مستبعدة')}${v5Metric('مسدد بمطابقة السندات',matched,'لا يزيد القبض مرة ثانية','good')}${v5Metric('إجمالي المطلوب سداده',outstanding,'قد يكون هناك قبض لم يُطابق بعد','warn')}${v5Metric('رصيد تجاوز الاستحقاق',R14.sum(active.filter(c=>c.due&&c.due<r14Today()),c=>R14.remaining(data,c)),'بحسب المطابقة المسجلة','bad')}</div><div class="panel"><div class="panel-title"><h2>مطالبات العملاء</h2><div class="actions"><button class="btn primary" onclick="openClaim()">+ مطالبة جديدة</button><button class="btn" onclick="openReceipt()">+ تسجيل تحصيل</button><button class="btn" onclick="exportAllExcel()">Excel شامل</button></div></div><p class="hint">طابق السندات مع المطالبات قبل اعتماد المتأخرات. المطابقة تخص مبلغ كل مشروع على حدة.</p>${claimTable(data.claims)}</div><div class="panel"><h2>التحصيل وتوزيع السندات</h2>${receiptTable(data.clientReceipts)}</div>`};

function r14ClientCashPanel(n){const t=customerTotals(n);return `<div class="panel"><h3>مطابقة قبض العميل</h3><div class="v5-metrics">${v5Metric('قبض فعلي',t.cash,'السندات والمقدمات دون تكرار تخصيصها','good')}${v5Metric('مخصص للمشاريع',t.receipts,'يخفض رصيد عقد المشروع')}${v5Metric('رصيد غير موزع',t.unallocated,'يشمل باقي السندات والمقدمات','warn')}${v5Metric('متبقي بعد كامل قبض العميل',R14.delta(t.contracts,t.cash),'للمراجعة على مستوى العميل؛ الافتتاحي منفصل')}</div><p class="hint">القبض الفعلي = المخصص للمشاريع + غير الموزع. لتوزيع باقي سند قبض، افتح «تعديل» السند وغيّر التوزيع مع إبقاء إجماليه. المقدمات تُوزع من المالية المتقدمة.</p></div>`}

printClaim=function(enc){
  const c=data.claims.find(x=>x.id===decodeURIComponent(enc));if(!c)return;
  const w=window.open('','_blank');if(!w)return alert('اسمح بالنوافذ المنبثقة للطباعة');
  w.document.open();w.document.write(r14ClaimDocument(c));w.document.close();
  // Wait for project thumbnails and fonts before opening print preview.
  const ready=Promise.all([...w.document.images].map(img=>img.decode().catch(()=>{})).concat(w.document.fonts?.ready||[]));
  ready.then(()=>{if(!w.closed){w.focus();w.print()}});
};

v8Review=function(){const issues=v8Audit();modal('فحص سلامة الحسابات والبيانات',`<div class="notice">${issues.length?'توجد ملاحظات: '+issues.length:'نجحت فحوص الربط والمبالغ والمقدمات ومطابقة المطالبات'}</div>${issues.map(t=>`<p>${esc(t)}</p>`).join('')}<p class="hint">الفحص يراجع اتساق السجلات داخل البرنامج؛ راجع الأرصدة مع مستنداتك الفعلية.</p><div class="modalfoot"><button class="btn primary" onclick="backup()">نسخة احتياطية</button><button class="btn" onclick="closeModal()">إغلاق</button></div>`)};
v8Btn.onclick=v8Review;

let r14PendingImport=null;
function r14BytesBase64(bytes){let s='';for(let i=0;i<bytes.length;i+=16384)s+=String.fromCharCode(...bytes.subarray(i,i+16384));return btoa(s)}
function r14ImportSummary(v){return `${v.projects.length} مشروع · ${v.assignments.length} تكليف مصمم · ${v.payments.length} دفعة مصمم · ${v.claims.length} مطالبة · ${v.clientReceipts.length} سطر تحصيل · ${v.advances.length} مقدمة · ${v.projectExpenses.length} مصروف · ${Object.keys(v.receiptAttachments).length} مرفق`}
function r14PreviewImport(value,name){
  const next=R14.validate(value);r14PendingImport=next;
  const photos=next.projects.reduce((n,p)=>n+(p.photos||[]).length,0);
  const precise=next.projects.filter(p=>Number(p.contract)!==R14.cents(p.contract)/100);
  modal('مراجعة النسخة قبل الاستيراد',`<p><b>${esc(name)}</b></p><div class="notice">${esc(r14ImportSummary(next))}</div><p>${photos} صورة مرتبطة بالمشاريع.</p>${precise.length?`<p class="notice">${precise.length} عقد في النسخة القديمة يحتوي على أجزاء أصغر من القرش. تُحفظ القيم الأصلية كما هي، وتُقرب مبالغ العرض والتسوية لأقرب قرش. المشاريع: ${esc(precise.map(p=>p.code).join('، '))}.</p>`:''}<p>${next.clientReceipts.length?'التحصيلات مستقلة عن دفعات المصممين.':'هذه النسخة لا تحتوي على تحصيلات عملاء؛ دفعات المصممين تبقى في حساباتهم.'}</p><p>الاستيراد يستبدل البيانات الحالية. إذا كانت لديك سجلات حاليًا، سينزّل البرنامج نسخة منها قبل الاستبدال.</p><p class="hint">اختر أحدث نسخة احتياطية لديك. لا تُرفع البيانات إلى الإنترنت.</p><div class="modalfoot"><button class="btn primary" onclick="r14AcceptImport()">استيراد هذه النسخة</button><button class="btn" onclick="r14PendingImport=null;closeModal()">إلغاء</button></div>`);
}
function r14AcceptImport(){
  if(!r14PendingImport)return;
  if(data.projects.length||data.clientReceipts.length||data.payments.length)backup();
  if(r14BootIssue&&r14Disk)r14ExportUnreadable();
  const issue=r14BootIssue;r14BootIssue='';
  if(r14Persist(r14PendingImport,'استيراد نسخة احتياطية')){r14PendingImport=null;closeModal();go('dashboard');notify('تم استيراد البيانات. راجع الأرصدة ثم حمّل نسخة احتياطية V14.')}else r14BootIssue=issue;
}
function r14ExportUnreadable(){if(r14Disk)download('RONIX_Stored_Data_Before_Recovery.json',r14Disk,'application/json')}
async function r14ReadArchive(file){
  if(file.size>40*1024*1024)throw Error('حجم الملف يتجاوز 40 ميجابايت');
  let total=0,entries=0;
  const archive=fflate.unzipSync(new Uint8Array(await file.arrayBuffer()),{filter(entry){
    if(++entries>1000)throw Error('عدد ملفات الأرشيف كبير جدًا');
    if(entry.name.split('/').includes('..')||entry.name.startsWith('/'))throw Error('مسار غير صالح في الأرشيف');
    const wanted=/\.json$/i.test(entry.name)||/\/project_media\/[^/]+\.(?:png|jpe?g|webp|gif)$/i.test('/'+entry.name);
    if(wanted){total+=entry.originalSize;if(total>30*1024*1024||entry.originalSize>20*1024*1024)throw Error('محتوى الأرشيف يتجاوز الحد المدعوم')}
    return wanted;
  }});
  const backups=[];
  for(const [name,bytes] of Object.entries(archive))if(/\.json$/i.test(name)){
    try{const d=JSON.parse(fflate.strFromU8(bytes));if(Array.isArray(d.projects)&&Array.isArray(d.payments)&&Array.isArray(d.assignments))backups.push({name,data:d})}catch{}
  }
  if(!backups.length)throw Error('لا توجد نسخة حسابات JSON داخل الملف. صدّر نسخة احتياطية من البرنامج القديم ثم استوردها هنا.');
  function hydrate(item){const d=R14.normalize(item.data),prefix=item.name.slice(0,item.name.lastIndexOf('/')+1);for(const p of d.projects)for(const photo of p.photos||[]){if(!photo.src.startsWith('project_media/'))continue;const bytes=archive[prefix+photo.src]||archive[photo.src];if(!bytes)throw Error('صورة ناقصة من الأرشيف: '+photo.src);const ext=photo.src.split('.').pop().toLowerCase(),mime=ext==='jpg'?'jpeg':ext;photo.src='data:image/'+mime+';base64,'+r14BytesBase64(bytes)}return d}
  if(backups.length===1){r14PreviewImport(hydrate(backups[0]),file.name);return}
  window.r14ChooseArchive=function(index){try{const item=backups[Number(index)];r14PreviewImport(hydrate(item),item.name);window.r14ChooseArchive=null}catch(e){alert(e.message)}};
  modal('اختر نسخة الحسابات من الأرشيف',`<p>الملف يحتوي على أكثر من نسخة؛ اختر النسخة التي تريد استعادتها.</p><select class="field" id="r14ArchiveChoice">${backups.map((b,i)=>`<option value="${i}">${esc(b.name)} · ${b.data.projects.length} مشروع</option>`).join('')}</select><div class="modalfoot"><button class="btn primary" onclick="r14ChooseArchive(val('r14ArchiveChoice'))">مراجعة النسخة</button></div>`);
}
restoreData=async function(input){const file=input.files?.[0];if(!file)return;input.value='';try{if(file.size>40*1024*1024)throw Error('الملف أكبر من 40 ميجابايت');if(/\.zip$/i.test(file.name))await r14ReadArchive(file);else r14PreviewImport(JSON.parse(await file.text()),file.name)}catch(e){r14PendingImport=null;alert('تعذر الاستيراد دون تغيير البيانات الحالية:\n'+e.message)}};
backup=function(){download('RONIX_V14_Backup_'+r14Today()+'.json',JSON.stringify({...data,schemaVersion:14,currency:'EGP',exportedAt:new Date().toISOString()},null,2),'application/json;charset=utf-8');r14OldNotify('نُزّلت النسخة الاحتياطية بما فيها الصور والمرفقات المحفوظة')};
function r14Help(){modal('بدء العمل على النسخة المحسنة',`<p><b>هذا تحديث للبرنامج الأصلي RONIX V13.</b> جميع الأقسام الأصلية موجودة في القائمة.</p><ol><li>لجلب النسخة التي أرسلتها، اضغط «استيراد» واختر ملف ZIP الأصلي. سينقل الحسابات وصور المشاريع من النسخة الاحتياطية الموجودة فيه.</li><li>إذا عملت على البرنامج القديم بعد تاريخ نسخته الاحتياطية، صدّر منه أحدث ملف JSON واستورده بدلًا منها.</li><li>راجع عدد السجلات ثم اعتمد الاستيراد. افتح «فحص البيانات» وراجع كشف عميل ومصمم.</li><li>سجّل القبض من العملاء ووزعه جزئيًا أو كليًا. الباقي يبقى باسم العميل. سجّل دفعات المصممين في قسم الدفعات.</li><li>من المطالبات، اضغط «مطابقة» واربط المبالغ المقبوضة بالمطالبة المناسبة.</li><li>نزّل نسخة احتياطية بعد جلسة العمل؛ البيانات تحفظ في هذا المتصفح على هذا الجهاز.</li></ol><p>Excel للتقارير، وJSON لاستعادة جميع البيانات. لا تجمع القبض مع المطالبات، ولا تجمع دفعات المصمم مع أتعابه كتكلفة ثانية.</p><div class="modalfoot"><button class="btn primary" onclick="closeModal();$('restore').click()">استيراد ZIP أو JSON</button><button class="btn" onclick="closeModal()">إغلاق</button></div>`)}
const r14Render=render;
render=function(){
  r14Render();
  const content=$('content');
  if(r14BootIssue)content.insertAdjacentHTML('afterbegin',`<div class="panel"><h2>البيانات المحفوظة تحتاج استعادة</h2><p>${esc(r14BootIssue)}</p><button class="btn" onclick="r14ExportUnreadable()">تنزيل البيانات قبل الإصلاح</button><button class="btn primary" onclick="$('restore').click()">استيراد نسخة سليمة</button></div>`);
  else if(!data.projects.length)content.insertAdjacentHTML('afterbegin',`<div class="panel r14-welcome"><h2>برنامجك الأصلي، مع تحسين الحسابات · V14.2</h2><p>ابدأ باستيراد ملف ZIP القديم لنقل المشاريع والمصممين والدفعات والمطالبات والصور.</p><div class="actions"><button class="btn primary" onclick="$('restore').click()">استيراد برنامجك القديم ZIP / JSON</button><button class="btn" onclick="editProject()">إنشاء أول مشروع</button><button class="btn" onclick="r14Help()">طريقة العمل</button></div><p class="hint">تُقرأ الملفات على جهازك فقط. لا توجد بيانات عملاء مضمنة في ملف التحديث.</p></div>`);
};
const r14Modal=modal;
modal=function(title,body){r14Modal(title.replaceAll('*** ',''),body);for(const input of $('modalBody').querySelectorAll('input[type=number]')){input.step='0.01';if(input.min==='1')input.min='0.01'}$('overlay').setAttribute('role','dialog');$('overlay').setAttribute('aria-modal','true');$('overlay').setAttribute('aria-labelledby','modalTitle')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('restore').accept='.json,.zip';
document.querySelector('.logo').innerHTML=`<img class="r14-logo" src="${R14_LOGO}" alt="RONIX">`;
document.querySelector('.sublogo').textContent='PROJECT FINANCE · V14.2';
document.querySelector('.sidebar-footer').innerHTML='RONIX V14.2 · جنيه مصري<br>حفظ محلي على هذا الجهاز والمتصفح';
const help=document.createElement('button');help.className='nav';help.textContent='؟ بدء العمل والمساعدة';help.onclick=r14Help;document.querySelector('.sidebar-footer').before(help);
document.querySelector('.footer').textContent='RONIX V14.2 · احتفظ بنسخة احتياطية بعد جلسة العمل';
for(const b of document.querySelectorAll('.nav'))b.innerHTML=b.innerHTML.replaceAll('*** ','');
document.title='RONIX V14.2 | المشاريع والمصممون والتحصيل والمطالبات';
